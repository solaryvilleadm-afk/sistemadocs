<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solary Ville Santa Felicidade · Central de Documentos</title>
<style>
:root{
  --navy:#132434; --gold:#b9976a; --bg:#eef1f4; --line:#d7dde3; --txt:#1d2b38; --muted:#5d6b78; --red:#c0392b;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Segoe UI',Arial,sans-serif;}
#topo{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;}
#topo h1{font-family:Georgia,serif;font-weight:normal;font-size:20px;margin:0;letter-spacing:.3px;}
#topo span{color:var(--gold);font-size:13px;}
#menu-btn{display:none;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:6px 10px;font-size:14px;}
#app{display:flex;min-height:calc(100vh - 56px);}
#lateral{width:250px;flex:none;background:#fff;border-right:1px solid var(--line);padding:14px 0;}
#lateral .grupo{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:14px 18px 6px;}
#lateral button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 18px;font-size:14px;color:var(--txt);cursor:pointer;border-left:3px solid transparent;}
#lateral button:hover{background:#f5f7f9;}
#lateral button.ativo{background:#f2ece2;border-left-color:var(--gold);font-weight:600;}
#centro{flex:1;display:flex;gap:22px;padding:22px;align-items:flex-start;min-width:0;}
#painel{width:390px;flex:none;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:sticky;top:14px;max-height:calc(100vh - 28px);display:flex;flex-direction:column;}
#painel-cab{background:var(--navy);color:#fff;padding:14px 18px;}
#painel-cab h2{margin:0;font-family:Georgia,serif;font-weight:normal;font-size:17px;}
#painel-cab p{margin:4px 0 0;font-size:12px;color:#c9d3dc;}
#form{padding:6px 18px 14px;overflow:auto;flex:1;}
.secao{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);}
.campo{margin-bottom:9px;}
.campo label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;}
.campo input,.campo select{width:100%;padding:7px 9px;border:1px solid #c6ced6;border-radius:6px;font-size:14px;font-family:inherit;}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ajuda{font-size:11px;color:var(--muted);margin-top:3px;}
.docs-lista label{display:flex;gap:8px;align-items:center;font-size:13px;margin:5px 0;}
#acoes{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fafbfc;}
#acoes button{flex:1;padding:10px;border-radius:7px;border:0;font-size:14px;cursor:pointer;font-weight:600;}
#btn-gerar{background:var(--navy);color:#fff;}
#btn-tudo{background:var(--gold);color:#fff;}
#paginas{flex:1;display:flex;flex-direction:column;align-items:center;gap:22px;min-width:0;}
.doc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
.doc-barra{width:210mm;max-width:100%;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;}
.doc-barra strong{font-size:14px;color:var(--navy);}
.doc-barra button{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer;}
.vazio{background:#fff;border:1px dashed #b8c2cc;border-radius:10px;padding:40px;color:var(--muted);text-align:center;max-width:600px;}

/* ===== página A4 ===== */
.pagina{width:210mm;height:297mm;background:#fff;position:relative;box-shadow:0 2px 12px rgba(0,0,0,.12);overflow:hidden;}
.pagina .cab{position:absolute;top:0;left:0;width:210mm;height:auto;}
.pagina .rod{position:absolute;bottom:0;left:0;width:210mm;height:auto;}
.pagina .corpo{position:absolute;top:48mm;bottom:26mm;left:20mm;right:20mm;overflow:hidden;
  font-family:Georgia,'Times New Roman',serif;font-size:10.5pt;line-height:1.38;color:#111;}
.corpo p{margin:0 0 6.5pt;}
.corpo .esp{height:8pt;}
.corpo .ass{text-align:center;margin:16pt 0 4pt;page-break-inside:avoid;}
.corpo .ass p{margin:0;}
.corpo table{width:100%;border-collapse:collapse;margin:0 0 8pt;table-layout:fixed;font-size:9.5pt;}
.corpo td{padding:3pt 5pt;vertical-align:top;}
.corpo table.borda td{border:0.75pt solid #9aa5b1;}
.ph{color:var(--red);background:#fdecea;border-radius:2px;padding:0 2px;}
.val{font-weight:600;}

@media (max-width:1100px){
  #centro{flex-direction:column;align-items:stretch;}
  #painel{width:auto;position:static;max-height:none;}
  #paginas{align-items:flex-start;overflow-x:auto;}
}
@media (max-width:760px){
  #menu-btn{display:inline-block;}
  #lateral{display:none;position:absolute;z-index:5;top:56px;left:0;bottom:0;box-shadow:2px 0 12px rgba(0,0,0,.15);}
  body.menu-aberto #lateral{display:block;}
  #centro{padding:12px;}
}
@media print{
  body{background:#fff;}
  #topo,#lateral,#painel,.doc-barra,.vazio{display:none !important;}
  #app,#centro,#paginas,.doc-wrap{display:block !important;padding:0 !important;margin:0 !important;gap:0 !important;}
  body.so-um .doc-wrap:not(.imprimir){display:none !important;}
  .pagina{box-shadow:none;page-break-after:always;break-after:page;}
  .pagina:last-child{page-break-after:auto;}
  .ph{color:inherit;background:none;}
  @page{size:A4;margin:0;}
}
</style>
</head>
<body>
<div id="topo">
  <button id="menu-btn" onclick="document.body.classList.toggle('menu-aberto')">Menu</button>
  <h1>Solary Ville Santa Felicidade</h1><span>Central de Documentos</span>
</div>
<div id="app">
  <nav id="lateral"></nav>
  <main id="centro">
    <section id="painel">
      <div id="painel-cab"><h2 id="titulo-pacote"></h2><p id="sub-pacote"></p></div>
      <div id="form"></div>
      <div id="acoes">
        <button id="btn-gerar">Gerar documentos</button>
        <button id="btn-tudo">Imprimir todos</button>
      </div>
    </section>
    <section id="paginas"><div class="vazio">Preencha os dados e clique em "Gerar documentos". Cada documento sai no papel timbrado da unidade, pronto para imprimir ou salvar em PDF.</div></section>
  </main>
</div>

<script>
const DOCS = {"permanente": [{"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><span style=\"font-size:14.0pt\"><b>CONTRATO DE PRESTAÇÃO DE SERVIÇOS</b></span></span>"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\">Moradia Permanente · Instituição de Longa Permanência para Idosos</span>"}, {"t": "p", "a": "justify", "h": "<b>CONTRATANTE:</b> Sr(a). [nome do idoso], [nacionalidade], natural de [naturalidade], nascido(a) em [data de nascimento], portador(a) do CPF [cpf] e RG [rg], residente no endereço [endereço], juntamente com seus responsáveis ANUENTES Sr(a). [nome do responsável 1], [nacionalidade do responsável 1], nascido(a) em [data de nascimento do responsável 1], portador(a) do CPF [cpf do responsável 1] e RG [rg do responsável 1], residente no endereço [endereço do responsável 1], e Sr(a). [nome do responsável 2], [nacionalidade do responsável 2], nascido(a) em [data de nascimento do responsável 2], portador(a) do CPF [cpf do responsável 2] e RG [rg do responsável 2], residente no endereço [endereço do responsável 2], doravante denominada CONTRATANTE."}, {"t": "p", "a": "justify", "h": "<b>CONTRATADA:</b> VS FATTORE INSTITUIÇÃO DE LONGA PERMANÊNCIA LTDA (SOLARY VILLE SANTA FELICIDADE - Instituição de Longa Permanência para Idosos), pessoa jurídica de direito privado, devidamente inscrita no CNPJ nº 57.764.744/0001-08, com sede na Rua Fredolin Wolf, nº 3290/3700, bairro Santa Felicidade, CEP 82410-326, em Curitiba/PR, neste ato representada por sua sócia administradora Susiane Pinkowski Santos, CPF nº 709.556.469-87, RG 3737471-7 SESP/PR, doravante denominada CONTRATADA."}, {"t": "p", "a": "justify", "h": "Pelo presente instrumento particular, as partes acima qualificadas, na melhor forma de direito, ajustam e contratam a prestação de serviços profissionais destinados a moradia definitiva, temporária e/ou provisória de idosos nos termos da Lei 10.741/2003 (Estatuto do Idoso), segundo as cláusulas e condições adiante descritas:"}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DO OBJETO — CLÁUSULA PRIMEIRA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "O objeto do presente contrato consiste na prestação de serviços de Instituição de Longa Permanência, destinada em domicílio coletivo de pessoas com idade igual ou superior a 60 (sessenta) anos."}, {"t": "p", "a": "justify", "h": "Parágrafo único: O morador passa a ter o direito de ser residente na ILPI (Instituição de Longa Permanência para Idosos) denominada “SOLARY VILLE SANTA FELICIDADE”, fazendo-o, mediante pagamento em regime particular de atendimento."}, {"t": "p", "a": "justify", "h": "1.1 Faz parte integrante do objeto do presente instrumento a prestação dos seguintes serviços pela CONTRATADA à CONTRATANTE:"}, {"t": "p", "a": "justify", "h": "I – Acomodação em quarto individual ou duplo, com banheiro coletivo e/ou suíte, sala coletiva de TV, sala de atendimento de enfermagem, sala de atividades/recreação/lazer, área externa/jardim, refeitório, conforme opção da CONTRATANTE e/ou disponibilidade da CONTRATADA;"}, {"t": "p", "a": "justify", "h": "II – Fornecimento de 06 (seis) refeições diárias, isto (café da manhã, colação, almoço, lanche da tarde, jantar e ceia), sendo o cardápio devidamente elaborado por nutricionista;"}, {"t": "p", "a": "justify", "h": "III – Serviços de limpeza diária dos quartos, banheiros e ambientes comuns da Instituição;"}, {"t": "p", "a": "justify", "h": "IV – Serviços de lavanderia;"}, {"t": "p", "a": "justify", "h": "V - Serviços de cuidador de idoso, não individual, atuando 24 (vinte e quatro) horas por dia para as atividades de vida diárias internas da Instituição;"}, {"t": "p", "a": "justify", "h": "VI – Atividades coordenadas por profissionais devidamente capacitados visando à preservação da saúde física e mental e aperfeiçoamento moral, intelectual, espiritual e social da CONTRATANTE."}, {"t": "p", "a": "justify", "h": "VII – Atividades que visam a preservação do vínculo familiar;"}, {"t": "p", "a": "justify", "h": "VIII – Alimentação diferenciada quando houver indicação médica (exemplo: hipossódica, hiper proteica, hipercalórica etc.);"}, {"t": "p", "a": "justify", "h": "VIX – Preferências alimentares fora do cardápio deverão ser previamente informadas e disponibilizadas pela família para análise de custos."}, {"t": "p", "a": "justify", "h": "1.2 Não estão compreendidos no objeto deste Contrato os seguintes serviços;"}, {"t": "p", "a": "justify", "h": "I - Fornecimento de refeições para familiares (salvo evento coletivo);"}, {"t": "p", "a": "justify", "h": "II - Fornecimento de fraldas, absorventes, produtos de higiene pessoal particular, luvas, vestuário, roupas de cama e banho, dentre outros;"}, {"t": "p", "a": "justify", "h": "III - Fornecimento de medicação de uso particular da CONTRATANTE;"}, {"t": "p", "a": "justify", "h": "IV - Suplementos vitamínicos, dietas e dietas enterais;"}, {"t": "p", "a": "justify", "h": "V - Materiais de enfermagem em geral, como exemplo: sondas, soros e acessórios, seringas, agulhas, material para curativos e similares;"}, {"t": "p", "a": "justify", "h": "VI - Fisioterapia de reabilitação individualizado;"}, {"t": "p", "a": "justify", "h": "VII - Exames complementares de diagnóstico;"}, {"t": "p", "a": "justify", "h": "VIII - Consultas médicas de urgência ou eletivas;"}, {"t": "p", "a": "justify", "h": "IX - Aluguel de aparelhos hospitalares;"}, {"t": "p", "a": "justify", "h": "X - Cilindro ou concentrador de Oxigênio;"}, {"t": "p", "a": "justify", "h": "XI - Transporte a consultas, exames e atendimentos externos de rotina;"}, {"t": "p", "a": "justify", "h": "XII - Tratamentos de beleza e estética;"}, {"t": "p", "a": "justify", "h": "XIII - Outros extras, de caráter pessoal, solicitados pela CONTRATANTE;"}, {"t": "p", "a": "justify", "h": "XIV - A instituição não disponibiliza de profissionais para serviços externos do CONTRATANTE como: consultas médicas, acompanhamento hospitalar, dentre outros similares. Caso seja necessário este deslocamento e a CONTRATADA tenha disponibilidade, será cobrada uma diária de serviços prestados, mediante acordo prévio."}, {"t": "p", "a": "justify", "h": "XV – Exclusividade de cuidados, estímulos, preferências por colaboradores e quaisquer serviços não apresentados neste contrato."}, {"t": "p", "a": "justify", "h": "Parágrafo Primeiro: Quando prestado qualquer um dos serviços enumerados na Cláusula 1.2, serão faturados como extra no final de cada mês corrente."}, {"t": "p", "a": "justify", "h": "Parágrafo Segundo: Em caso de falecimento, o responsável se compromete a arcar com todas as despesas que se fizerem necessárias, devendo enviar uma cópia do atestado de óbito para baixa do prontuário."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DAS ACOMODAÇÕES ESCOLHIDAS — CLÁUSULA SEGUNDA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "2.1 - O MORADOR, assim como seu representante legal, declara expressamente que aceitam, de livre e espontânea vontade, as acomodações indicadas pela CONTRATADA, as quais se adaptam aos critérios técnicos de humanização e de atendimento especializado."}, {"t": "p", "a": "justify", "h": "2.2 - A acomodação indicada pela CONTRATADA somente sofrerá alteração se houver vaga para a acomodação pretendida pela MORADORA e ainda, e principalmente, se houver compatibilidade técnica na substituição."}, {"t": "p", "a": "justify", "h": "2.3 - Sempre que o MORADOR apresentar agravo temporário, ou definitivo, de sua saúde poderá a CONTRATADA, a seu próprio critério, efetuar sua transferência para outra acomodação, compatível com as necessidades do MORADOR, ou ainda, encaminhá-lo para estabelecimento de saúde apto ao tratamento de que necessite (custo que será suportado diretamente pelo MORADOR ou RESPONSÁVEL LEGAL)."}, {"t": "p", "a": "justify", "h": "2.4 - A família do MORADOR, ou seu representante legal, será antecipadamente informada de qualquer alteração de acomodações da contratante."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DO PRAZO DE VALIDADE DO CONTRATO — CLÁUSULA TERCEIRA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "3.1 - A vigência do presente contrato de prestação de serviços será de 12 (doze) meses a contar da data da assinatura."}, {"t": "p", "a": "justify", "h": "3.2 - Findo o prazo estabelecido no item 3.1 ficará o contrato automaticamente prorrogado por prazo de mais 12 (doze) meses, e assim sucessivamente, sendo que a parte que não deseje tal prorrogação, deverá informar a outra com pelo menos 15 (quinze) dias de antecedência."}, {"t": "p", "a": "justify", "h": "3.3 - Ao ingressar na instituição mantida pela CONTRATADA, O MORADOR passará por um prazo de adaptação de 30 (trinta) dias, prazo em que será verificada tanto pelo MORADOR, quanto pela CONTRATADA, a viabilidade do abrigamento."}, {"t": "p", "a": "justify", "h": "3.4 - A permanência do abrigamento, sempre que possível, e de forma preponderante, levará em conta a vontade manifesta do candidato a morador."}, {"t": "p", "a": "justify", "h": "3.5 - Fica consignado pelas partes que quando O MORADOR passar a apresentar grave estado de saúde, poderá a CONTRATADA solicitar a mudança do MORADOR para estabelecimento de saúde apto ao tratamento de que necessite, ou, então, para moradia de sua família."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DA RESCISÃO — CLÁUSULA QUARTA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "4.1 - O presente contrato poderá ser resilido, a qualquer tempo e por qualquer das partes, independentemente de motivação e sem que este fato implique no direito de indenização, devendo a parte interessada notificar expressamente a outra com antecedência mínima de 30 (trinta) dias."}, {"t": "p", "a": "justify", "h": "4.1.1 – Em caso de resilição, por qualquer das partes, permanecerá devido o valor referente ao período de 30 (trinta) dias após a comunicação."}, {"t": "p", "a": "justify", "h": "4.1.2 – A comunicação para resilição deverá ser efetuada por escrito pelas partes, preferencialmente por e-mail, conforme a seguir: à CONTRATADA: contatosantafelicidade@solaryville.com.br ; à CONTRATANTE: [email do responsável]."}, {"t": "p", "a": "justify", "h": "4.2 - A ausência (falta sequencial ou intermitente), por quaisquer motivos, seja de viagens, internamentos, etc., não desobriga a CONTRATANTE dos valores devidos pelo respectivo período."}, {"t": "p", "a": "justify", "h": "4.3 - O presente contrato será extinto de pleno direito no caso de falecimento do CONTRATANTE, não sendo prevista a devolução de valores pagos no que tange o mês em vigência."}, {"t": "p", "a": "justify", "h": "4.4 - Caberá a rescisão unilateral imediata, a critério da parte prejudicada, nos seguintes casos:"}, {"t": "p", "a": "justify", "h": "I – Atraso pelo CONTRATANTE no pagamento das parcelas ajustadas na CLÁUSULA OITAVA deste instrumento no prazo superior a 30 (trinta) dias;"}, {"t": "p", "a": "justify", "h": "II – Descumprimento de quaisquer cláusulas contratuais por quaisquer das partes."}, {"t": "p", "a": "justify", "h": "4.4.1.- Em caso de rescisão por culpa da CONTRATANTE, os valores pagos não são reembolsáveis e será aplicável multa rescisória no valor equivalente a 50% do valor estabelecido no item 8.3. em caso de não cumprimento do aviso prévio."}, {"t": "p", "a": "justify", "h": "4.4.2.- Em caso de rescisão por culpa da CONTRATADA, o valor remanescente proporcional ao período mensal faltante será reembolsado à CONTRATANTE."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DAS OBRIGAÇÕES DA CONTRATADA — CLÁUSULA QUINTA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "5.1- A CONTRATADA, em seu atendimento, manterá os seguintes princípios, respeitados os limites impostos no regimento interno da ILPI: Manter padrões de habitação compatíveis com as necessidades das idosas atendidas, bem como provê-las com alimentação regular e higiene."}, {"t": "p", "a": "justify", "h": "5.2 Estabelecer atendimento de moradia digna adotando os seguintes princípios estabelecidos na Lei n.º 10.741 de 1.º de outubro de 2003 (Estatuto do Idoso):"}, {"t": "p", "a": "justify", "h": "I – Preservação dos vínculos familiares;"}, {"t": "p", "a": "justify", "h": "II – Atendimento personalizado e em pequenos grupos;"}, {"t": "p", "a": "justify", "h": "III – Manutenção do idoso na mesma instituição, salvo em caso de força maior;"}, {"t": "p", "a": "justify", "h": "IV – Participação do idoso nas atividades comunitárias, de caráter interno e externo;"}, {"t": "p", "a": "justify", "h": "V – Observância dos direitos e garantias dos idosos;"}, {"t": "p", "a": "justify", "h": "VI – Preservação da identidade do idoso e oferecimento de ambiente de respeito e dignidade;"}, {"t": "p", "a": "justify", "h": "VII – Oferecer acomodações apropriadas para recebimento de visitas;"}, {"t": "p", "a": "justify", "h": "VIII – Propiciar cuidados à saúde, conforme necessidade do idoso;"}, {"t": "p", "a": "justify", "h": "IX – Promover atividades educacionais, esportivas, culturais e de lazer;"}, {"t": "p", "a": "justify", "h": "X – Propiciar assistência religiosa àqueles que desejarem, de acordo com as suas crenças;"}, {"t": "p", "a": "justify", "h": "XI – Proceder o estudo social e pessoal de cada caso;"}, {"t": "p", "a": "justify", "h": "XII – Comunicar a autoridade competente de saúde toda ocorrência de idoso portador de doenças infectocontagiosas;"}, {"t": "p", "a": "justify", "h": "XIII – Providenciar ou solicitar que o Ministério Público requisite os documentos necessários ao exercício da cidadania àqueles que não os tiverem, na forma da lei."}, {"t": "p", "a": "justify", "h": "XIV – Manter arquivo de anotações onde constem data e circunstâncias do atendimento, nome do idoso, responsável, parentes, endereços, cidade e relação de seus pertences, bem como o valor de contribuições, e suas alterações, se houver, e demais dados que possibilitem sua identificação e a individualização do atendimento;"}, {"t": "p", "a": "justify", "h": "XV – Comunicar o Ministério Público para as providências cabíveis, a situação de abandono moral ou material por parte dos familiares."}, {"t": "p", "a": "justify", "h": "5.3 - A CONTRATADA se compromete a envidar todos os esforços necessários para cumprir com o exposto no presente contrato, preservando identidade e privacidade do CONTRATANTE, agindo sempre em consonância com os ditames legais, éticos e de boa fé aplicáveis, respeitando todos os direitos da pessoa idosa."}, {"t": "p", "a": "justify", "h": "5.4 - A CONTRATADA conta com quadro de profissionais com formação específica a fim de atender ao CONTRATANTE."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DAS RESPONSABILIDADES DO CONTRATANTE E DE SUA FAMÍLIA — CLÁUSULA SEXTA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "6.1 - Compete à família do MORADOR zelar pela preservação e manutenção dos vínculos familiares, mantendo a mesma inteira responsabilidade de visitação e assistência do MORADOR, seja ela econômica ou moral."}, {"t": "p", "a": "justify", "h": "6.2 - Compete ao familiar o cumprimento de compromissos familiares, tais como visitar regularmente ao idoso e, se possível, levá-lo a passeios, bem como acompanhá-lo em consultas médicas, emergências e internamentos;"}, {"t": "p", "a": "justify", "h": "6.3 - Comparecer em reuniões familiares, datas festivas ou quando solicitado pela instituição;"}, {"t": "p", "a": "justify", "h": "6.4 - Informar previamente horários, 12 horas de antecedência, de consultas e exames agendados, bem como saídas do morador (lazer, viagens, almoços etc.) para que a instituição possa prepará-lo para tais compromissos;"}, {"t": "p", "a": "justify", "h": "6.5 - Manter todos os endereços e telefones atualizados dos familiares para serem contatados em caso de necessidade;"}, {"t": "p", "a": "justify", "h": "6.6 - É de responsabilidade do MORADOR, ou de seu representante, a posse e guarda de todos seus documentos, devendo entregar à CONTRATADA cópia colorida e legível do RG e CPF;"}, {"t": "p", "a": "justify", "h": "6.7 - Indicar para a CONTRATADA, no ato de assinatura deste instrumento, a relação de medicamentos de uso contínuo, controlados ou não, que faça uso a CONTRATANTE, bem como informações pessoais (como alergias, tipo sanguíneo etc.) e os respectivos receituários médicos com a descrição dos medicamentos, dosagem e posologia."}, {"t": "p", "a": "justify", "h": "6.8 - Fornecer à CONTRATADA no ato de assinatura do presente Instrumento, uma relação com os bens e pertences PESSOAIS do CONTRATANTE que trouxer para moradia, identificando as peças de vestuário pessoal, cama e banho, atualizando a relação com a entrada e/ou retirada destes itens, os quais devem ser entregues até um dia útil antes da entrada do morador na instituição."}, {"t": "p", "a": "justify", "h": "6.9 - Indicar para a CONTRATADA, no prazo máximo de 48 (quarenta e oito) horas a contar do início da vigência deste instrumento, todos os dados cadastrais e telefones de contatos de profissionais que atendam às necessidades particulares do CONTRATANTE, tais como médicos, fisioterapeutas, dentistas, nutricionistas, dentre outros profissionais de forma a permitir que, em caso de necessidade, a CONTRATADA possa entrar em contato com estes profissionais."}, {"t": "p", "a": "justify", "h": "6.10 - Cabe a MORADORA, sua família e ainda representantes, respeitar a instituição, seus funcionários e demais moradores, não podendo proceder de forma negativa ou causando transtornos que venham a interferir nos serviços prestados. A prática reiterada de desrespeito às normas de convivência ensejará a imediata rescisão do presente contrato e a concessão de prazo de 15 (quinze) dias para a saída do MORADOR da instituição."}, {"t": "p", "a": "justify", "h": "6.11 - O MORADOR e seus familiares, ou representantes, devem respeitar as normas internas, notadamente as que dizem respeito aos horários de visitas previamente agendadas (das 13:00 às 17:00) e acesso as dependências da CONTRATADA, a qual deve ser realizada acompanhada de um profissional da instituição, salvo quartos individuais."}, {"t": "p", "a": "justify", "h": "6.12 - É de exclusiva responsabilidade do MORADOR, e ainda de seus familiares e representantes, o fornecimento e custeio das despesas extraordinárias, ocasionadas por demanda pessoal do MORADOR ou ainda decorrentes de indicação terapêutica, tais como, exemplificativamente: fraldas geriátricas, suplementações dietéticas, dietas enterais, medicamentos e procedimentos especiais de alta complexidade, órteses, próteses, medicamentos em geral, produtos de beleza, perfumaria, guloseimas (deverão ser entregues a responsável técnica e/ou assistente de coordenação) acessórios, telefones celulares, aparelhos sonoros, acompanhante hospitalar e todas as congêneres e que por definição não guardem relação com o abrigamento prestado. Todo material acima citado deve ser entregue na instituição em horário comercial, de segunda a sexta-feira."}, {"t": "p", "a": "justify", "h": "6.13 - O familiar/responsável compromete-se a enviar previamente os materiais não oferecidos pela CONTRATADA supra descritos, quando da real necessidade da CONTRATADA, medicamentos e produtos de higiene até o último dia útil de cada mês, de acordo com pedido enviado dia 20, em horário comercial."}, {"t": "p", "a": "justify", "h": "6.14 - Caso o MORADOR necessite com urgência de algum material constante na Cláusula Sexta do presente Instrumento, e o FAMILIAR/RESPONSÁVEL não puder prover imediatamente, poderá a CONTRATADA, mediante prévia autorização do FAMILIAR/RESPONSÁVEL, prover provisoriamente e incluir na cobrança na mensalidade do mês posterior."}, {"t": "p", "a": "justify", "h": "6.15 - É facultado ao MORADOR, sua família ou representante, a escolha do profissional médico de referência para atendimento, assumindo ainda, responsabilidade pelos tratamentos pós-alta médica hospitalar. Poderá, ainda, o MORADOR, contratar serviço particular de ambulância, sempre que tal medida se fizer necessária para atendimento de seu quadro clínico."}, {"t": "p", "a": "justify", "h": "6.16 - É expressamente proibido fazer uso de cigarros, charutos ou outros produtos fumiguemos nas dependências cobertas da instituição (verificar área específica autorizada)."}, {"t": "p", "a": "justify", "h": "6.17 – É expressamente proibida a entrada de objetos de valor sentimental ou pecuniário, como joias, relógios, entre outros, nas dependências da instituição. No entanto, caso seja o desejo do familiar ou da moradora, esses objetos poderão ser trazidos, assumindo total responsabilidade por eventuais danos, perdas ou extravios, isentando a CONTRATADA de qualquer responsabilidade. A instituição realiza a revisão e o cuidado com os pertences dos moradores, mas, por tratar-se de uma Instituição de Longa Permanência para Idosos (ILPI), onde atendemos pessoas com condições como demência, Alzheimer, entre outras, não podemos garantir a segurança de objetos de valor. Ressalta-se que, em especial, joias e outros itens de valor elevado devem ser mantidos fora das dependências da ILPI, visto o risco inerente ao atendimento deste público. Quanto aos equipamentos eletrônicos, estes poderão ser trazidos, desde que devidamente relacionados em formulário próprio, sendo de inteira responsabilidade dos familiares ou da moradora em caso de danos, avarias ou extravio. A utilização desses equipamentos será permitida, desde que não interfira nas atividades da moradora nem no convívio em comunidade. A CONTRATADA não se responsabiliza por quaisquer ocorrências relacionadas a esses itens."}, {"t": "p", "a": "justify", "h": "6.18 - A CONTRATANTE declara e reconhece que no estabelecimento da CONTRATADA não é indicado que sejam trazidos e mantidos bens de valor pecuniário ou sentimental substanciais. Todos os bens e objetos de valor considerável devem ser previamente informados pela CONTRATADA e inventariados, sendo facultado à CONTRATADA recusar que determinados bens ou objetos sejam mantidos no estabelecimento. Quando do encerramento do presente contrato, as partes procederão à vistoria dos bens e objetos inventariados. Após o encerramento do presente contrato, a CONTRATADA terá o prazo de 07 (sete) dias corridos para reivindicar ou reclamar eventuais incongruências em relação a bens e objetos."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DAS RESPONSABILIDADES E DECLARACÕES DA MORADORA E FAMILIARES — CLÁUSULA SÉTIMA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "7.1 - O MORADOR e seus familiares/responsáveis, declaram que o MORADOR não é portadora de doença infectocontagiosa."}, {"t": "p", "a": "justify", "h": "7.2 - O MORADOR e seus familiares/responsáveis declaram que o MORADOR esteve submetida a Laudo Médico e/ou Psiquiátrico de Avaliação, o qual neste ato apresentado, passando a fazer parte integrante deste contrato, assumindo o MORADOR e seus representantes familiares a responsabilidade pela veracidade das informações ali constantes."}, {"t": "p", "a": "justify", "h": "7.2.1 – O MORADOR e seus familiares/responsáveis devem declarar toda e qualquer alteração comportamental, seja de ordem física ou mental, independente de já estar previamente validado por laudo médico, onde qualquer omissão de informações a respeito, poderão acarretar medidas sancionatórias."}, {"t": "p", "a": "justify", "h": "7.3 - O FAMILIAR/RESPONSÁVEL LEGAL declara que O MORADOR, durante a vigência deste contrato, continuará sob sua inteira responsabilidade, na qualidade de familiar, cabendo ao RESPONSÁVEL prestar toda a assistência inerente ao vínculo parental, seja econômica ou moral."}, {"t": "p", "a": "justify", "h": "7.4 - Após o abrigamento do MORADOR, fica expressamente consignadas as seguintes OBRIGAÇÕES AO RESPONSÁVEL:"}, {"t": "p", "a": "justify", "h": "I) Visitar o idoso(a) periodicamente, com a finalidade de preservar o vínculo familiar em eventos comemorativos e respeitando o horário de visitação, assinando o livro de visitas com data e horário de entrada e saída."}, {"t": "p", "a": "justify", "h": "II) Retirar o idoso(a) da instituição quando for devidamente requerido pela CONTRATADA, sob pena de transferência compulsória para outra instituição, pública ou filantrópica, eximindo-se a CONTRATADA de quaisquer responsabilidades;"}, {"t": "p", "a": "justify", "h": "III) Acompanhar o programa de atendimento que será prestado ao MORADOR;"}, {"t": "p", "a": "justify", "h": "IV) Respeitar a instituição CONTRATADA, não procedendo de forma negativa de forma a causar transtornos que venham a interferir na assistência prestada;"}, {"t": "p", "a": "justify", "h": "V) Preservar sempre o ambiente de respeito e dignidade que vigoram dentro da instituição, de forma que haja sempre harmonia, seja em relação às idosas, seja em relação aos funcionários da instituição;"}, {"t": "p", "a": "justify", "h": "VI) Proceder sempre de acordo com as orientações designadas pela CONTRATADA, com a finalidade de propiciar o melhor atendimento a pessoa idosa."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DO PREÇO - CONDIÇÕES DE PAGAMENTO E DEMAIS INERENTES — CLÁUSULA OITAVA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "8.1. Pelos serviços descritos nas cláusulas anteriores, o CONTRATANTE pagará a CONTRATADA antecipadamente o valor mensal de acordo com o tipo de acomodação e o grau de dependência."}, {"t": "p", "a": "justify", "h": "8.2 - O valor da mensalidade será baseado no grau de dependência e nas acomodações."}, {"t": "p", "a": "justify", "h": "8.3 - O valor mensal será de R$ [valor mensal]."}, {"t": "p", "a": "justify", "h": "8.3.1 – O décimo terceiro deverá ser pago no dia 10 dos meses de novembro e dezembro de cada ano, via boleto bancário, computando o valor proporcional dos meses utilizados no ano. Em caso de saída por rescisão ou falecimento, será cobrado o valor proporcional dos meses utilizados até 10 dias após a saída."}, {"t": "p", "a": "justify", "h": "8.4 - A acomodação escolhida e o grau de dependência da pessoa idosa na data da assinatura do presente contrato; [tipo de acomodação], grau [grau de dependência] (avaliado pela equipe, levando em consideração o laudo médico)."}, {"t": "p", "a": "justify", "h": "8.5 - O valor mensal descrito na CLÁUSULA OITAVA será corrigido anualmente pela variação do IPC – Índice Geral do Consumidor (calculado pelo FGV) e reajustado de acordo com a tabela vigente do ano."}, {"t": "p", "a": "justify", "h": "8.6 - Os Moradores serão periodicamente avaliadas para a verificação da necessidade de cuidados extras diante de uma possível evolução de grau de dependência. (Ex: grau II para o III.). Tal avaliação será realizada por profissionais de equipe técnica, a aferição do grau de dependência será realizada segundo os parâmetros da RDC 502 da ANVISA, sendo informado ao responsável ou familiar imediatamente tal evolução. Será permitida avaliação por profissional de escolha do familiar, assim sendo confirmado, será realizado o enquadramento contratual e por sua vez acrescido 30% do valor mensal pago a cada evolução de grau."}, {"t": "p", "a": "justify", "h": "8.7 - O valor descrito na CLÁUSULA OITAVA deverá ser pago mensalmente e antecipadamente pela CONTRATANTE, no dia 01 (um) de cada mês, por boleto bancário (enviar comprovante via e-mail contatosantafelicidade@solaryville.com.br)."}, {"t": "p", "a": "justify", "h": "8.8 - Havendo atraso no pagamento dos valores descritos na CLÁUSULA OITAVA haverá incidência de multa moratória de até 2% (dois por cento) ao mês do seu valor em conformidade com o disposto no §1.º do artigo 52 da Lei 8.078/90 (Código de Defesa do Consumidor)."}, {"t": "p", "a": "justify", "h": "8.9 - Após o dia 30 (trigésimo) dia seguinte ao vencimento, sem que haja pagamento, seguirá para protesto e fica o presente contrato automaticamente rescindido, devendo a MORADORA e seu RESPONSÁVEL retirar os pertences, sob pena de em não o fazendo, ocorrer à comunicação formal ao Ministério Público por abandono de pessoa idosa por sua família e responsável."}, {"t": "p", "a": "justify", "h": "8.10 - A CONTRATANTE deverá ressarcir à CONTRATADA, no próximo dia 01 (um) de cada mês — ou seja, juntamente com a antecipação da mensalidade — todos os gastos extras que, excepcionalmente, a CONTRATADA venha a antecipar, tais como: materiais de higiene, medicamentos, fraldas, manicure, cabeleireiro e assemelhados, bem como eventuais reparos, substituições ou reposições decorrentes de avarias causadas por uso inadequado ou mau uso de bens da unidade pela CONTRATANTE, devidamente comprovados por nota fiscal ou relatório técnico. Tais valores deverão estar acompanhados da devida discriminação e comprovação, e serão incluídos em demonstrativo específico."}, {"t": "p", "a": "justify", "h": "8.11 - O MORADOR e seu RESPONSÁVEL são solidariamente responsáveis por todas as obrigações fixadas neste instrumento, conforme estabelece, o Art. 264 e seguintes do Código Civil Brasileiro, tendo o credor a faculdade de exigir a totalidade da dívida tanto de um devedor, quanto de outro, ficando, portanto, expressamente renunciado o benefício de ordem."}, {"t": "p", "a": "justify", "h": "8.12 - A CONTRATADA dispõe de linha telefônica a qual é destinada a uso exclusivo da instituição. As ligações particulares das idosas serão cobradas como extra e lançadas para o próximo pagamento."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DAS OBRIGAÇÕES DO CONTRATANTE e/ou RESPONSÁVEL ANUENTE — CLÁUSULA NONA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "9.1. Promover o pagamento dos valores devidos à CONTRATADA descritos na CLÁUSULA OITAVA deste instrumento, na forma e prazos estabelecidos."}, {"t": "p", "a": "justify", "h": "9.2. Fornecer à CONTRATADA no ato de assinatura do presente Instrumento, uma relação com os bens e pertences pessoais do CONTRATANTE, como também identificando as peças de vestuário pessoal, cama e banho, atualizando a relação com a entrada e/ou retirada destes itens, com entrega de recibo de depósito dos bens confiados a CONTRATADA."}, {"t": "p", "a": "justify", "h": "9.3. O CONTRATANTE deverá respeitar as normas e regulamentos da Instituição, sob pena de rescisão contratual;"}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>MONITORAMENTO E PRIVACIDADE — CLÁUSULA DECIMA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "10.1 - Monitoramento Institucional: A contratante declara estar ciente e de acordo com o sistema de monitoramento por câmeras de vídeo e/ou áudio instalado nas dependências internas e externas da instituição, operado exclusivamente pela empresa, com a finalidade de garantir a segurança, o bem-estar e a transparência dos cuidados prestados aos residentes. As imagens e áudios captados poderão ser utilizados exclusivamente pela instituição para fins internos, administrativos, de segurança ou legais, em conformidade com a legislação vigente, especialmente a Lei Geral de Proteção de Dados (LGPD)."}, {"t": "p", "a": "justify", "h": "10.2 - Autorização para Uso de Imagem e Som: Os residentes e seus representantes legais, ao firmarem o presente contrato, autorizam expressamente o uso de suas imagens e sons captados pelas câmeras institucionais da CONTRATADA, exclusivamente para fins internos, administrativos, de segurança ou legais. É vedada a reprodução, o compartilhamento ou a utilização externa desse material sem autorização formal e prévia da instituição, ressalvadas as hipóteses de requisição por autoridade judicial, policial ou administrativa competente, nos termos da legislação vigente."}, {"t": "p", "a": "justify", "h": "10.3 - Proibição de Instalação de Equipamentos Particulares: É expressamente proibida a instalação, utilização ou manutenção de câmeras, microfones, gravadores ou quaisquer dispositivos de captação de imagem ou som de propriedade particular dentro das dependências da instituição, inclusive nos quartos dos residentes, ainda que com o consentimento do residente ou de seus familiares."}, {"t": "p", "a": "justify", "h": "10.4 - Justificativa da Restrição: Tal proibição visa proteger a privacidade, intimidade e dignidade dos demais residentes e da equipe técnica, uma vez que o ambiente é compartilhado, com circulação de pessoas e prestação de cuidados íntimos e sensíveis. O uso de dispositivos particulares por terceiros poderá acarretar violação à privacidade de terceiros, uso indevido de imagem e som, além de responsabilidade civil e trabalhista para a instituição."}, {"t": "p", "a": "justify", "h": "10.5 - Penalidades: O descumprimento desta cláusula poderá ensejar medidas administrativas, legais e, se necessário, a rescisão contratual por justa causa, sem prejuízo das indenizações cabíveis pelos danos eventualmente causados."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DAS DISPOSIÇÕES GERAIS — CLÁUSULA DECIMA PRIMEIRA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "11.1 - CONTRATANTE declara-se ciente de que as cláusulas e disposições presentes neste instrumento de prestação de serviços, perdurarão até a rescisão do presente."}, {"t": "p", "a": "justify", "h": "11.2 - Qualquer tolerância por quaisquer das partes em relação a obrigações que devam ser cumpridas pela outra não deverá ser interpretada como precedente, novação ou renúncia aos direitos que a lei e o presente contrato assegurem."}, {"t": "p", "a": "justify", "h": "11.3 - Fica pactuado entre as partes a ausência de qualquer tipo de relação de subordinação."}, {"t": "p", "a": "justify", "h": "11.4 - É obrigação da CONTRATADA, oferecer ao CONTRATANTE cópia do presente instrumento, contendo todas as especificidades da prestação de serviços da CONTRATADA."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DO FORO — CLÁUSULA DECIMA SEGUNDA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "12.1. O presente instrumento é constituído pelas partes em conformidade com o art. 585, II, CPC, constituindo-se título executivo extrajudicial."}, {"t": "p", "a": "justify", "h": "12.2. Fica eleito o foro da Comarca de Curitiba – PR para dirimir quaisquer questões oriundas deste contrato, renunciando as partes a qualquer outro, por mais privilegiado que seja."}, {"t": "p", "a": "justify", "h": "E assim, por estarem justas e contratadas, firmam o presente instrumento, em duas vias de igual teor e forma, na presença de 02 (duas) testemunhas abaixo qualificadas, obrigando-se ao seu fiel cumprimento, por si e seus sucessores."}, {"t": "p", "a": "justify", "h": "Curitiba (PR), [data]."}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>CONTRATANTE (residente)</b></span>"}, {"t": "p", "a": "center", "h": "<b>[nome do idoso]</b>"}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<b>ANUENTE / RESPONSÁVEL do CONTRATANTE</b>"}, {"t": "p", "a": "center", "h": "<b>[nome do responsável 1]</b>"}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<b>ANUENTE / RESPONSÁVEL do CONTRATANTE</b>"}, {"t": "p", "a": "center", "h": "<b>[nome do responsável 2]</b>"}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>SOLARY VILLE SANTA FELICIDADE</b></span>"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>CONTRATADA</b></span>"}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>TESTEMUNHAS:</b></span>", "k": 1}, {"t": "tab", "b": false, "w": [50.0, 50.0], "r": [[{"h": "________________________________<br>Nome:<br>RG:", "span": 1, "a": "center"}, {"h": "________________________________<br>Nome:<br>RG:", "span": 1, "a": "center"}]]}], "centrodia": [{"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><span style=\"font-size:14.0pt\"><b>CONTRATO DE PRESTAÇÃO DE SERVIÇOS</b></span></span>"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\">Centro Dia · Atenção à Pessoa Idosa</span>"}, {"t": "p", "a": "justify", "h": "<b>CONTRATANTE:</b> Sr(a). [nome do idoso], [nacionalidade], nascido(a) em [data de nascimento], portador(a) do CPF [cpf] e RG [rg], residente no endereço [endereço], juntamente com seu(sua) responsável ANUENTE Sr(a). [nome do responsável], [nacionalidade do responsável], nascido(a) em [data de nascimento do responsável], portador(a) do CPF [cpf do responsável] e RG [rg do responsável], residente no endereço [endereço do responsável], doravante denominada CONTRATANTE."}, {"t": "p", "a": "justify", "h": "<b>CONTRATADA:</b> VS FATTORE INSTITUIÇÃO DE LONGA PERMANÊNCIA LTDA (SOLARY VILLE SANTA FELICIDADE - Instituição de Longa Permanência para Idosos), pessoa jurídica de direito privado, devidamente inscrita no CNPJ nº 57.764.744/0001-08, com sede na Rua Fredolin Wolf, nº 3290/3700, bairro Santa Felicidade, CEP 82410-326, em Curitiba/PR, neste ato representada por sua sócia administradora Susiane Pinkowski Santos, CPF nº 709.556.469-87, RG 3737471-7 SESP/PR, doravante denominada CONTRATADA."}, {"t": "p", "a": "justify", "h": "Pelo presente instrumento particular, as partes acima qualificadas, na melhor forma de direito, ajustam e contratam a prestação de serviços profissionais destinados a moradia definitiva, temporária e/ou provisória de idosos nos termos da Lei 10.741/2003 (Estatuto do Idoso), segundo as cláusulas e condições adiante descritas:"}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA PRIMEIRA - Do Objeto</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "1.1. O idoso passa a ter o direito de receber atendimento diário em Centro Dia de Atenção à Pessoa Idosa, fazendo-o mediante pagamento em regime particular de atendimento."}, {"t": "p", "a": "justify", "h": "1.2. A prestação de serviços ora pactuada garante ao idoso:"}, {"t": "p", "a": "justify", "h": "a) Alimentação com quatro refeições diárias, quando integral ou proporcional ao período contratado, isto é, café da manhã, colação, almoço e lanche da tarde. Cardápio elaborado por nutricionista."}, {"t": "p", "a": "justify", "h": "b) Cuidado e auxílio nas atividades de vida diária."}, {"t": "p", "a": "justify", "h": "c) Local para descanso em sala coletiva, podendo guardar seus pertences de forma individualizada."}, {"t": "p", "a": "justify", "h": "d) Serviço de limpeza diária dos ambientes comuns."}, {"t": "p", "a": "justify", "h": "e) Serviço de cuidador de idosos, não individual, garantindo as atividades de vida diária durante a sua permanência no Centro Dia. Podendo ser período integral ou meio período."}, {"t": "p", "a": "justify", "h": "f) Atividades que estimulam física e mentalmente o idoso, conforme sua capacidade."}, {"t": "p", "a": "justify", "h": "1.2.1. O atendimento não importa no fornecimento de qualquer tratamento de saúde, nem tampouco despesas extraordinárias do idoso, conforme determinado pelo item 6.5 deste contrato."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA SEGUNDA - Da admissão da pessoa idosa</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "2.1. Para ingressar no Centro Dia será necessária uma entrevista inicial com o preenchimento de formulário de dados da pessoa idosa."}, {"t": "p", "a": "justify", "h": "2.1.1. Toda informação referente a pessoa idosa é de responsabilidade exclusiva da CONTRATANTE."}, {"t": "p", "a": "justify", "h": "2.2. A pessoa idosa passará por Avaliação Inicial que servirá como base para a elaboração do Plano de Atenção Individualizado."}, {"t": "p", "a": "justify", "h": "2.2.1. Toda informação contida nos formulários é de propriedade da pessoa idosa e poderá ser solicitado a qualquer momento pelo CONTRATANTE."}, {"t": "p", "a": "justify", "h": "2.3. Será respeitada a vontade tácita ou expressa da pessoa idosa em ingressar no Centro Dia."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA TERCEIRA - Dos Valores</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "O valor escolhido pelo CONTRATANTE:"}, {"t": "p", "a": "justify", "h": "3.1. Diárias avulsas no valor de R$ [valor da diária] ([valor por extenso]) cada."}, {"t": "p", "a": "justify", "h": "3.2. Pacote de diárias de segunda a sexta-feira, nos dias escolhidos pelo CONTRATANTE ([dias da semana]), em período integral, das 08h às 17h, ou em meio período, das 13h às 17h. Período contratado: [integral ou meio período]."}, {"t": "p", "a": "justify", "h": "3.3. Atividades individualizadas (musicoterapia, fisioterapia, terapia ocupacional, nutrição, psicologia, fonoaudiologia, psicopedagogia) serão cobradas por hora/atendimento."}, {"t": "p", "a": "justify", "h": "3.3.1. O serviço de banho será cobrado separadamente, se necessário."}, {"t": "p", "a": "justify", "h": "3.4. Os valores das mensalidades serão cobrados todo dia 01 de cada mês, referentes aos dias usufruídos no mês anterior, via transferência bancária para o Banco Itaú, agência 7013, conta 03143-5, em nome de VS FATTORE INSTITUIÇÃO DE LONGA PERMANÊNCIA LTDA, CNPJ 57.764.744/0001-08, ou via Pix pela chave celular (41) 98821-4720."}, {"t": "p", "a": "justify", "h": "3.5. Eventos sociais serão cobrados à parte."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA QUARTA - Do Prazo de Validade do Contrato</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "4.1. O presente contrato terá prazo indeterminado começando a vigorar na data de sua assinatura, sendo que a parte que desejar rescindir o presente contrato deverá informar a outra com pelo menos 15 (quinze) dias de antecedência;"}, {"t": "p", "a": "justify", "h": "4.2. O CONTRATANTE poderá solicitar a interrupção das atividades no Centro Dia, devendo efetuar o pedido formal à administração da empresa pelo e-mail: contatosantafelicidade@solaryville.com.br. A mera ausência não caracteriza interrupção do atendimento, sendo imprescindível a formalização do pedido."}, {"t": "p", "a": "justify", "h": "4.3 - O presente contrato será extinto de pleno direito no caso de falecimento do CONTRATANTE, não sendo prevista a devolução de valores pagos no que tange o mês em vigência."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA QUINTA - Das Responsabilidades da CONTRATADA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "5.1. Cabe à CONTRATADA fornecer ao participante do Centro Dia atendimento cotidiano de acordo com as normas estabelecidas na Lei 10.741/03 (Estatuto do Idoso), bem como das demais disposições estabelecidas neste contrato."}, {"t": "p", "a": "justify", "h": "5.2. A CONTRATADA, em seu atendimento, terá como base os seguintes princípios:"}, {"t": "p", "a": "justify", "h": "a) preservação e manutenção dos vínculos familiares;"}, {"t": "p", "a": "justify", "h": "b) atendimento adaptado às exigências individuais do participante do Centro Dia."}, {"t": "p", "a": "justify", "h": "c) preservação da identidade do idoso e de sua dignidade."}, {"t": "p", "a": "justify", "h": "d) participação da pessoa idosa nas atividades em grupo, de caráter interno, proporcionando atividades terapêuticas, culturais e de lazer."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA SEXTA - Das Responsabilidades do CONTRATANTE</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "6.1. É de responsabilidade da pessoa idosa, ou de seu representante, a posse e guarda de todos os seus documentos originais, devendo apresentá-los à CONTRATADA sempre que esta os solicitar."}, {"t": "p", "a": "justify", "h": "6.2. Cabe a pessoa idosa, sua família e ainda representantes, respeitar a empresa, seus funcionários e demais idosos, não podendo proceder de forma negativa ou causando transtornos que venham a interferir nos serviços prestados. A prática reiterada de desrespeito as normas de convivência ensejam a imediata rescisão do presente contrato e a concessão de prazo de até 05 (cinco) dias para o desligamento do idoso."}, {"t": "p", "a": "justify", "h": "6.3. - É expressamente proibido fazer uso de cigarros, charutos ou outros produtos fumiguemos nas dependências cobertas da instituição (verificar área específica autorizada)."}, {"t": "p", "a": "justify", "h": "6.4. Não é permitido trazer acompanhantes que não sejam também participantes do Centro Dia."}, {"t": "p", "a": "justify", "h": "§ 1. Serão permitidos acompanhantes cuidadores formais da pessoa idosa, desde que autorizado previamente pela CONTRATADA, sendo cobrada taxa extra."}, {"t": "p", "a": "justify", "h": "6.5. É de exclusiva responsabilidade do CONTRATANTE o fornecimento e custeio de despesas decorrentes de indicação terapêutica, tais como, exemplificadamente: fraldas geriátricas, suplementação dietéticas, medicamentos e procedimentos especiais de alta complexidade, órteses, próteses, medicamentos em geral, produtos de beleza, material de higiene pessoal, perfumaria, acessórios e todas as congêneres e que por definição não guardem relação com o serviço de Centro Dia."}, {"t": "p", "a": "justify", "h": "6.6 – É expressamente proibido a entrada de quaisquer objetos de valor, exemplo: joias, relógios etc., salvo equipamentos eletrônicos, os quais deverão ser relacionados em formulário próprio, sendo de inteira responsabilidade dos familiares/pessoa idosa em caso de perda ou avarias, que devem ser comunicadas imediatamente à CONTRATADA. O uso de tais equipamentos poderão ser liberado desde que não atrapalhe as atividades da moradora e convívio em comunidade."}, {"t": "p", "a": "justify", "h": "6.7 - O MORADOR e seus familiares, ou representantes, devem respeitar as normas internas, notadamente as que dizem respeito aos horários de visitas previamente agendadas (das 13:00 às 17:00) e acesso as dependências da CONTRATADA, a qual deve ser realizada acompanhada de um profissional da instituição, salvo quartos individuais."}, {"t": "p", "a": "justify", "h": "6.8 - A instituição não disponibiliza de profissionais para serviços externos do CONTRATANTE como: consultas médicas, acompanhamento hospitalar, dentre outros similares. Caso seja necessário este deslocamento e a CONTRATADA tenha disponibilidade, será cobrada uma diária de serviços prestados, mediante acordo prévio com a RT da unidade. Caso os hóspedes seja mantido internado o familiar deverá ficar com o idoso ou colocar uma profissional (A instituição não fornece esse profissional, podendo apenas indicar de acordo com disponibilidade do mesmo) sendo este custo do familiar responsável pagos diretamente para o profissional."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA SÉTIMA - Responsabilidades e Declarações do CONTRATANTE</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "7.1. O CONTRATANTE declara que a pessoa idosa não é portadora de doença infecto contagiosa."}, {"t": "p", "a": "justify", "h": "Em caso de emergência com o idoso, será imediatamente chamado o Serviço de Emergências Médicas e informado ao familiar responsável."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA OITAVA - Disposições Gerais</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "8.1. As partes, de comum acordo, desde já elegem o Foro desta Cidade e Comarca de Curitiba, com exclusão de qualquer outro por mais privilegiado que seja. E por estarem justos e acertados, assinam o presente Contrato em duas vias de igual teor e forma, na presença das testemunhas abaixo."}, {"t": "p", "a": "justify", "h": "Curitiba, [data]."}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>CONTRATANTE (idoso)</b></span>"}, {"t": "p", "a": "center", "h": "<b>[nome do idoso]</b>"}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<b>ANUENTE / RESPONSÁVEL do CONTRATANTE</b>"}, {"t": "p", "a": "center", "h": "<b>[nome do responsável]</b>"}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>SOLARY VILLE SANTA FELICIDADE</b></span>"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>CONTRATADA</b></span>"}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>TESTEMUNHAS:</b></span>", "k": 1}, {"t": "tab", "b": false, "w": [50.0, 50.0], "r": [[{"h": "________________________________<br>Nome:<br>RG:", "span": 1, "a": "center"}, {"h": "________________________________<br>Nome:<br>RG:", "span": 1, "a": "center"}]]}], "hotelaria": [{"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><span style=\"font-size:14.0pt\"><b>CONTRATO DE HOTELARIA</b></span></span>"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\">Hospedagem temporária · Instituição de Longa Permanência para Idosos</span>"}, {"t": "p", "a": "justify", "h": "<b>CONTRATANTE:</b> Sr(a). [nome do idoso], [nacionalidade], nascido(a) em [data de nascimento], portador(a) do CPF [cpf] e RG [rg], residente no endereço [endereço], juntamente com seu(sua) responsável ANUENTE Sr(a). [nome do responsável], [nacionalidade do responsável], nascido(a) em [data de nascimento do responsável], portador(a) do CPF [cpf do responsável] e RG [rg do responsável], residente no endereço [endereço do responsável], doravante denominada CONTRATANTE."}, {"t": "p", "a": "justify", "h": "<b>CONTRATADA:</b> VS FATTORE INSTITUIÇÃO DE LONGA PERMANÊNCIA LTDA (SOLARY VILLE SANTA FELICIDADE - Instituição de Longa Permanência para Idosos), pessoa jurídica de direito privado, devidamente inscrita no CNPJ nº 57.764.744/0001-08, com sede na Rua Fredolin Wolf, nº 3290/3700, bairro Santa Felicidade, CEP 82410-326, em Curitiba/PR, neste ato representada por sua sócia administradora Susiane Pinkowski Santos, CPF nº 709.556.469-87, RG 3737471-7 SESP/PR, doravante denominada CONTRATADA."}, {"t": "p", "a": "justify", "h": "Pelo presente instrumento particular, as partes acima qualificadas, na melhor forma de direito, ajustam e contratam a prestação de serviços profissionais destinados a moradia definitiva, temporária e/ou provisória de idosos nos termos da Lei 10.741/2003 (Estatuto do Idoso), segundo as cláusulas e condições adiante descritas:"}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA PRIMEIRA – DO OBJETO</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "HORÁRIOS: Check-in a partir das 14 horas da manhã e Check-out até as 12 horas."}, {"t": "p", "a": "justify", "h": "1.1. O idoso (a) passa a ter o direito de receber atendimento diário em serviços de hotelaria."}, {"t": "p", "a": "justify", "h": "1.2. A prestação de serviços ora pactuada garante ao idoso:"}, {"t": "p", "a": "justify", "h": "a) Alimentação completa, com até seis refeições diárias, isto é, café da manhã, colação, almoço, lanche da tarde, jantar e ceia sendo o cardápio elaborado por nutricionista."}, {"t": "p", "a": "justify", "h": "b) Cuidado e auxílio nas atividades de vida diária."}, {"t": "p", "a": "justify", "h": "c) Local para descanso em quarto duplo, podendo guardar seus pertences de forma individualizada."}, {"t": "p", "a": "justify", "h": "d) Serviço de limpeza diária dos ambientes comuns."}, {"t": "p", "a": "justify", "h": "e) Serviço de cuidador de idosos, que atuará em período de 24 horas e garantirá as atividades de vida diária durante a sua permanência na hotelaria."}, {"t": "p", "a": "justify", "h": "f) Atividades de estimulação física e mental do idoso, conforme sua capacidade."}, {"t": "p", "a": "justify", "h": "1.2.1. O atendimento não importa no fornecimento de qualquer tratamento de saúde, nem tampouco despesas extraordinárias do idoso, conforme determinado pelo item 6.5 deste contrato."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA SEGUNDA - DA ADMISSÃO DA PESSOA IDOSA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "2.1. Para ingressar na hotelaria será necessário: A entrega de laudo médico e prescrição medica, contendo o histórico de saúde da pessoa idosa, será realizado o preenchimento de formulário de dados da pessoa idosa, bem como e durante a hospedagem será feito avaliação pela equipe, para conclusão de grau de dependência planejamento de cuidados."}, {"t": "p", "a": "justify", "h": "2.1.1. Toda informação referente a pessoa idosa é de responsabilidade exclusiva da CONTRATANTE."}, {"t": "p", "a": "justify", "h": "2.2. A pessoa idosa passará por Avaliação Inicial que servirá como base para a elaboração do Plano de Atenção Individualizado."}, {"t": "p", "a": "justify", "h": "2.2.1. Toda informação contida nos formulários é de propriedade da pessoa idosa e poderá ser solicitado a qualquer momento pelo CONTRATANTE."}, {"t": "p", "a": "justify", "h": "2.2. Será respeitada a vontade tácita ou expressa da pessoa idosa em ingressar na hotelaria."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA TERCEIRA – DO PAGAMENTO</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "O valor escolhido pelo CONTRATANTE:"}, {"t": "p", "a": "justify", "h": "3.1. Pacote de hotelaria, contendo 30 diárias."}, {"t": "p", "a": "justify", "h": "3.2. Pacote mensal no valor de R$ [valor mensal] a serem pagos antecipadamente, devendo ser apresentado comprovante de deposito, junto a administração."}, {"t": "p", "a": "justify", "h": "3.3. Atividades individualizadas, caso solicitado quais sejam; musicoterapia, fisioterapia, terapia ocupacional, nutrição, psicologia, fonoaudiologia, psicopedagogia, serão cobradas por hora/atendimento. (extra)"}, {"t": "p", "a": "justify", "h": "3.4. Os valores de diárias estão acordados a ser pago via cheque."}, {"t": "p", "a": "justify", "h": "3.5. Valores extras como materiais para curativos, comidas fora do cardápio e afins são pagos pelo cliente."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA QUARTA – DO PRAZO DE VALIDADE DO CONTRATO</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "4.1. O presente contrato terá prazo determinado, à partir do dia [check-in] até dia [check-out] começando a vigorar na data de sua assinatura, sendo que a parte que desejar rescindir o presente contrato deverá informar a outra com antecedência, de 48 hs de antecedência, não sendo previsto devolução dos valores pagos em caso de preço promocional mensal e pagar mais a taxa administrativa recorrente de 20% sobre o valor total acordado em neste contrato; e no caso de renovação, com aditivos esclarecendo as datas."}, {"t": "p", "a": "justify", "h": "4.1.1. A CONTRATADA não dispõe de estrutura física para cuidar de idosos em grave estado de saúde ou dependência total (acamado). Caso a pessoa idosa passe a apresentar a situação acima, o CONTRATANTE responsabilizar-se-á de encontrar local adequado para este tipo de cuidado;"}, {"t": "p", "a": "justify", "h": "4.2. O CONTRATANTE poderá solicitar a interrupção das atividades na hotelaria, devendo efetuar o pedido formal à administração da empresa ou pelo e-mail: contatosantafelicidade@solaryville.com.br. A mera ausência por quaisquer motivos, não caracteriza interrupção do atendimento, sendo imprescindível a formalização do pedido."}, {"t": "p", "a": "justify", "h": "4.3 O presente contrato será extinto de pleno direito no caso de falecimento do CONTRATANTE, não sendo prevista a devolução de valores pagos no que tange o período em vigência."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA QUINTA - Das Responsabilidades da CONTRATADA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "5.1. Cabe à CONTRATADA fornecer ao participante da hotelaria, atendimento cotidiano de acordo com as normas estabelecidas na Lei 10.741/03 (Estatuto do Idoso), bem como das demais disposições estabelecidas neste contrato."}, {"t": "p", "a": "justify", "h": "5.2. A CONTRATADA, em seu atendimento, terá como base os seguintes princípios:"}, {"t": "p", "a": "justify", "h": "a) preservação e manutenção dos vínculos familiares;"}, {"t": "p", "a": "justify", "h": "b) atendimento adaptado às exigências individuais do participante da hotelaria."}, {"t": "p", "a": "justify", "h": "c) preservação da identidade do idoso e de sua dignidade."}, {"t": "p", "a": "justify", "h": "d)participação da pessoa idosa nas atividades em grupo, de caráter interno, proporcionando atividades terapêuticas, culturais e de lazer."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA SEXTA - DAS RESPONSABILIDADES DO CONTRATANTE</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "6.1. É de responsabilidade da pessoa idosa, ou de seu representante, a posse e guarda de todos os seus documentos originais, devendo apresentá-los à CONTRATADA sempre que esta os solicitar."}, {"t": "p", "a": "justify", "h": "6.2. Cabe a pessoa idosa, sua família e ainda representantes, respeitar a empresa, seus funcionários e demais idosos, não podendo proceder de forma negativa ou causando transtornos que venham a interferir nos serviços prestados. A prática reiterada de desrespeito às normas de convivência enseja a imediata rescisão do presente contrato e a concessão de prazo de até 05 (cinco) dias para o desligamento do idoso."}, {"t": "p", "a": "justify", "h": "6.3. É expressamente proibido fazer uso de cigarros, charutos ou outros produtos fumiguemos nas dependências cobertas da instituição (verificar área específica autorizada)."}, {"t": "p", "a": "justify", "h": "6.4. Não é permitido trazer acompanhantes que não sejam também participantes da casa desde que autorizado previamente pela CONTRATADA, sendo cobrada taxa de alimentação e banho."}, {"t": "p", "a": "justify", "h": "6.5. É de exclusiva responsabilidade do CONTRATANTE o fornecimento e custeio de despesas decorrentes de indicação terapêutica, tais como, ex: fraldas geriátricas, suplementação dietéticas, material de curativo (ex gase,micropre,antissepitico) medicamentos em geral e procedimentos especiais como órteses, próteses, produtos de beleza, material de higiene pessoal, perfumaria, roupas de banho e cama, e serviço de lavanderia. 6.5 Em caso de falecimento, o responsável se compromete a arcar com todas as despesas que se fizerem necessárias, devendo enviar uma cópia do atestado de óbito para baixa do prontuário."}, {"t": "p", "a": "justify", "h": "6.6 - O MORADOR e seus familiares, ou representantes, devem respeitar as normas internas, notadamente as que dizem respeito aos horários de visitas previamente agendadas (das 13:00 às 17:00) e acesso as dependências da CONTRATADA, a qual deve ser realizada acompanhada de um profissional da instituição, salvo quartos individuais."}, {"t": "p", "a": "justify", "h": "6.7 – É expressamente proibida a entrada de objetos de valor sentimental ou pecuniário, como joias, relógios, entre outros, nas dependências da instituição. No entanto, caso seja o desejo do familiar ou da moradora, esses objetos poderão ser trazidos, assumindo total responsabilidade por eventuais danos, perdas ou extravios, isentando a CONTRATADA de qualquer responsabilidade. A instituição realiza a revisão e o cuidado com os pertences dos moradores, mas, por tratar-se de uma Instituição de Longa Permanência para Idosos (ILPI), onde atendemos pessoas com condições como demência, Alzheimer, entre outras, não podemos garantir a segurança de objetos de valor. Ressalta-se que, em especial, joias e outros itens de valor elevado devem ser mantidos fora das dependências da ILPI, visto o risco inerente ao atendimento deste público."}, {"t": "p", "a": "justify", "h": "Quanto aos equipamentos eletrônicos, estes poderão ser trazidos, desde que devidamente relacionados em formulário próprio, sendo de inteira responsabilidade dos familiares ou da moradora em caso de danos, avarias ou extravio. A utilização desses equipamentos será permitida, desde que não interfira nas atividades da moradora nem no convívio em comunidade. A CONTRATADA não se responsabiliza por quaisquer ocorrências relacionadas a esses itens."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA SÉTIMA - RESPONSABILIDADES E DECLARAÇÕES DO CONTRATANTE</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "7.1. O CONTRATANTE declara que a pessoa idosa não é portadora de doença infecto contagiosa."}, {"t": "p", "a": "justify", "h": "Em caso de emergência com o idoso, será imediatamente chamado o Serviço de Emergências Médicas e informado ao familiar responsável."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA OITAVA - Disposições Gerais</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "8.1. As partes, de comum acordo, desde já elegem o Foro desta Cidade e Comarca de Curitiba, com exclusão de qualquer outro por mais privilegiado que seja. E por estarem justos e acertados, assinam o presente Contrato em duas vias de igual teor e forma, na presença das testemunhas abaixo."}, {"t": "p", "a": "justify", "h": "Curitiba (PR), [data]."}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<b>CONTRATANTE (idoso)</b>"}, {"t": "p", "a": "center", "h": "<b>[nome do idoso]</b>"}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<b>ANUENTE / RESPONSÁVEL do CONTRATANTE</b>"}, {"t": "p", "a": "center", "h": "<b>[nome do responsável]</b>"}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>SOLARY VILLE SANTA FELICIDADE</b></span>"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>CONTRATADA</b></span>"}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>TESTEMUNHAS:</b></span>", "k": 1}, {"t": "tab", "b": false, "w": [50.0, 50.0], "r": [[{"h": "________________________________<br>Nome:<br>RG:", "span": 1, "a": "center"}, {"h": "________________________________<br>Nome:<br>RG:", "span": 1, "a": "center"}]]}], "posop": [{"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><span style=\"font-size:14.0pt\"><b>CONTRATO DE HOTELARIA PÓS-OPERATÓRIO</b></span></span>"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\">Prestação de serviços de atendimento ao idoso · Regime de hotelaria</span>"}, {"t": "p", "a": "justify", "h": "<b>CONTRATANTE:</b> Sr(a). [nome do idoso], [nacionalidade], nascido(a) em [data de nascimento], portador(a) do CPF [cpf] e RG [rg], residente no endereço [endereço], juntamente com seu(sua) responsável ANUENTE Sr(a). [nome do responsável], [nacionalidade do responsável], nascido(a) em [data de nascimento do responsável], portador(a) do CPF [cpf do responsável] e RG [rg do responsável], residente no endereço [endereço do responsável], doravante denominada CONTRATANTE."}, {"t": "p", "a": "justify", "h": "<b>CONTRATADA:</b> VS FATTORE INSTITUIÇÃO DE LONGA PERMANÊNCIA LTDA (SOLARY VILLE SANTA FELICIDADE - Instituição de Longa Permanência para Idosos), pessoa jurídica de direito privado, devidamente inscrita no CNPJ nº 57.764.744/0001-08, com sede na Rua Fredolin Wolf, nº 3290/3700, bairro Santa Felicidade, CEP 82410-326, em Curitiba/PR, neste ato representada por sua sócia administradora Susiane Pinkowski Santos, CPF nº 709.556.469-87, RG 3737471-7 SESP/PR, doravante denominada CONTRATADA."}, {"t": "p", "a": "justify", "h": "Pelo presente instrumento particular, as partes acima qualificadas, na melhor forma de direito, ajustam e contratam a prestação de serviços profissionais destinados a moradia definitiva, temporária e/ou provisória de idosos nos termos da Lei 10.741/2003 (Estatuto do Idoso), segundo as cláusulas e condições adiante descritas:"}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA PRIMEIRA – DO OBJETO</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "Horários: check-in a partir das 14h e check-out até as 12h."}, {"t": "p", "a": "justify", "h": "1.1. O idoso(a) passa a ter o direito de receber atendimento diário em serviços de hotelaria pós-operatório."}, {"t": "p", "a": "justify", "h": "1.2. A prestação de serviços ora pactuada garante ao idoso:"}, {"t": "p", "a": "justify", "h": "a) Alimentação completa, com até seis refeições diárias, isto é, café da manhã, colação, almoço, lanche da tarde, jantar e ceia, sendo o cardápio elaborado por nutricionista."}, {"t": "p", "a": "justify", "h": "b) Cuidado e auxílio nas atividades de vida diária."}, {"t": "p", "a": "justify", "h": "c) Local para descanso em quarto coletivo, podendo guardar seus pertences de forma individualizada."}, {"t": "p", "a": "justify", "h": "d) Serviço de limpeza diária dos ambientes comuns."}, {"t": "p", "a": "justify", "h": "e) Serviço de cuidador de idosos, que atuará em período de 24 horas e garantirá as atividades de vida diária durante a sua permanência na hotelaria."}, {"t": "p", "a": "justify", "h": "f) Atividades de estimulação física e mental do idoso, conforme sua capacidade."}, {"t": "p", "a": "justify", "h": "1.2.1. O atendimento não importa no fornecimento de qualquer tratamento de saúde, nem tampouco despesas extraordinárias do idoso, conforme determinado pelo item 6.5 deste contrato."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA SEGUNDA – DA ADMISSÃO DA PESSOA IDOSA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "2.1. Para ingressar na hotelaria será necessária a entrega de laudo médico e prescrição médica, contendo o histórico de saúde da pessoa idosa. Será realizado o preenchimento de formulário de dados da pessoa idosa e, durante a hospedagem, será feita avaliação pela equipe para conclusão do grau de dependência e planejamento de cuidados."}, {"t": "p", "a": "justify", "h": "2.1.1. Toda informação referente à pessoa idosa é de responsabilidade exclusiva da CONTRATANTE."}, {"t": "p", "a": "justify", "h": "2.2. A pessoa idosa passará por Avaliação Inicial, que servirá como base para a elaboração do Plano de Atenção Individualizado."}, {"t": "p", "a": "justify", "h": "2.2.1. Toda informação contida nos formulários é de propriedade da pessoa idosa e poderá ser solicitada a qualquer momento pelo CONTRATANTE."}, {"t": "p", "a": "justify", "h": "2.3. Será respeitada a vontade tácita ou expressa da pessoa idosa em ingressar na hotelaria."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA TERCEIRA – DO PAGAMENTO</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "O valor escolhido pelo CONTRATANTE:"}, {"t": "p", "a": "justify", "h": "3.1. Pacote de hotelaria, contendo [quantidade de diárias] diárias."}, {"t": "p", "a": "justify", "h": "3.2. Pacote mensal (limitado a 60 dias) no valor de R$ [valor do pacote] ([valor do pacote por extenso]), a ser pago antecipadamente, devendo ser apresentado o comprovante de pagamento à administração."}, {"t": "p", "a": "justify", "h": "3.3. Atividades individualizadas, caso solicitadas, quais sejam: musicoterapia, fisioterapia, terapia ocupacional, nutrição, psicologia, fonoaudiologia e psicopedagogia, serão cobradas por hora/atendimento (extra)."}, {"t": "p", "a": "justify", "h": "3.4. Os valores de diárias extras devem ser pagos antes do check-in, via transferência bancária para o Banco Itaú, agência 7013, conta 03143-5, em nome de VS FATTORE INSTITUIÇÃO DE LONGA PERMANÊNCIA LTDA, CNPJ 57.764.744/0001-08, ou via Pix pela chave celular (41) 98821-4720."}, {"t": "p", "a": "justify", "h": "3.5. Valores extras, como lavanderia, materiais para curativos e afins, são pagos pelo CONTRATANTE."}, {"t": "p", "a": "justify", "h": "3.6. Após o 30º (trigésimo) dia seguinte ao vencimento (em caso de pacote mensal), sem que haja pagamento, seguirá para protesto e o presente contrato ficará automaticamente rescindido, devendo o idoso e seu RESPONSÁVEL retirar os pertences, sob pena de, em não o fazendo, ocorrer a comunicação formal ao Ministério Público por abandono de pessoa idosa por sua família e responsável."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA QUARTA – DO PRAZO DE VALIDADE DO CONTRATO</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "4.1. O presente contrato terá prazo determinado, a partir do dia [data de entrada] até o dia [data de saída], começando a vigorar na data de sua assinatura. A parte que desejar rescindir o presente contrato deverá informar a outra com 48 horas de antecedência e pagar a taxa administrativa de 20% sobre o valor total acordado neste contrato. Em caso de renovação, serão feitos aditivos esclarecendo as datas."}, {"t": "p", "a": "justify", "h": "4.1.1. A CONTRATADA não dispõe de estrutura física para cuidar de idosos em grave estado de saúde ou dependência total (acamado com necessidade de aparelhagem hospitalar). Caso a pessoa idosa passe a apresentar a situação acima, o CONTRATANTE responsabilizar-se-á por encontrar local adequado para este tipo de cuidado."}, {"t": "p", "a": "justify", "h": "4.2. O CONTRATANTE poderá solicitar a interrupção das atividades na hotelaria, devendo efetuar o pedido formal à administração da empresa ou pelo e-mail contatosantafelicidade@solaryville.com.br. A mera ausência, por quaisquer motivos, não caracteriza interrupção do atendimento, sendo imprescindível a formalização do pedido."}, {"t": "p", "a": "justify", "h": "4.3. O presente contrato será extinto de pleno direito no caso de falecimento do CONTRATANTE, não sendo prevista a devolução de valores pagos no que tange ao período em vigência."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA QUINTA – DAS RESPONSABILIDADES DA CONTRATADA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "5.1. Cabe à CONTRATADA fornecer ao participante da hotelaria atendimento cotidiano de acordo com as normas estabelecidas na Lei 10.741/03 (Estatuto do Idoso), bem como das demais disposições estabelecidas neste contrato."}, {"t": "p", "a": "justify", "h": "5.2. A CONTRATADA, em seu atendimento, terá como base os seguintes princípios:"}, {"t": "p", "a": "justify", "h": "a) preservação e manutenção dos vínculos familiares;"}, {"t": "p", "a": "justify", "h": "b) atendimento adaptado às exigências individuais do participante da hotelaria;"}, {"t": "p", "a": "justify", "h": "c) preservação da identidade do idoso e de sua dignidade;"}, {"t": "p", "a": "justify", "h": "d) participação da pessoa idosa nas atividades em grupo, de caráter interno, proporcionando atividades terapêuticas, culturais e de lazer."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA SEXTA – DAS RESPONSABILIDADES DO CONTRATANTE</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "6.1. É de responsabilidade da pessoa idosa, ou de seu representante, a posse e guarda de todos os seus documentos originais, devendo apresentá-los à CONTRATADA sempre que esta os solicitar."}, {"t": "p", "a": "justify", "h": "6.2. Cabe à pessoa idosa, sua família e ainda representantes, respeitar a empresa, seus funcionários e demais idosos, não podendo proceder de forma negativa ou causando transtornos que venham a interferir nos serviços prestados. A prática reiterada de desrespeito às normas de convivência enseja a imediata rescisão do presente contrato e a concessão de prazo de até 05 (cinco) dias para o desligamento do idoso."}, {"t": "p", "a": "justify", "h": "6.3. É expressamente proibido fazer uso de cigarros, charutos ou outros produtos fumígenos nas dependências cobertas da instituição (verificar área específica autorizada)."}, {"t": "p", "a": "justify", "h": "6.4. Não é permitido trazer acompanhantes que não sejam também participantes da casa, salvo se autorizado previamente pela CONTRATADA, sendo cobrada taxa de alimentação e banho."}, {"t": "p", "a": "justify", "h": "6.5. É de exclusiva responsabilidade do CONTRATANTE o fornecimento e custeio de despesas decorrentes de indicação terapêutica, tais como: fraldas geriátricas, suplementação dietética, material de curativo (gaze, micropore, antisséptico), medicamentos em geral e procedimentos especiais como órteses e próteses, produtos de beleza, material de higiene p
