essoal, perfumaria, roupas de banho e cama, e serviço de lavanderia."}, {"t": "p", "a": "justify", "h": "6.6. Em caso de falecimento, o responsável se compromete a arcar com todas as despesas que se fizerem necessárias, devendo enviar uma cópia do atestado de óbito para baixa do prontuário."}, {"t": "p", "a": "justify", "h": "6.7. O idoso e seus familiares, ou representantes, devem respeitar as normas internas, notadamente as que dizem respeito aos horários de visitas previamente agendadas (das 13h às 17h) e ao acesso às dependências da CONTRATADA, o qual deve ser realizado acompanhado de um profissional da instituição, salvo quartos individuais."}, {"t": "p", "a": "justify", "h": "6.8. É expressamente proibida a entrada de objetos de valor sentimental ou pecuniário, como joias, relógios, entre outros, nas dependências da instituição. No entanto, caso seja o desejo do familiar ou do idoso, esses objetos poderão ser trazidos, assumindo total responsabilidade por eventuais danos, perdas ou extravios, isentando a CONTRATADA de qualquer responsabilidade. A instituição realiza a revisão e o cuidado com os pertences dos moradores, mas, por tratar-se de uma Instituição de Longa Permanência para Idosos (ILPI), onde são atendidas pessoas com condições como demência, Alzheimer, entre outras, não é possível garantir a segurança de objetos de valor. Ressalta-se que, em especial, joias e outros itens de valor elevado devem ser mantidos fora das dependências da ILPI, visto o risco inerente ao atendimento deste público."}, {"t": "p", "a": "justify", "h": "6.8.1. Quanto aos equipamentos eletrônicos, estes poderão ser trazidos, desde que devidamente relacionados em formulário próprio, sendo de inteira responsabilidade dos familiares ou do idoso em caso de danos, avarias ou extravio. A utilização desses equipamentos será permitida, desde que não interfira nas atividades do idoso nem no convívio em comunidade. A CONTRATADA não se responsabiliza por quaisquer ocorrências relacionadas a esses itens."}, {"t": "p", "a": "justify", "h": "6.9. A CONTRATANTE declara e reconhece que no estabelecimento da CONTRATADA não é indicado que sejam trazidos e mantidos bens de valor pecuniário ou sentimental substanciais. Todos os bens e objetos de valor considerável devem ser previamente informados pela CONTRATADA e inventariados, sendo facultado à CONTRATADA recusar que determinados bens ou objetos sejam mantidos no estabelecimento. Quando do encerramento do presente contrato, as partes procederão à vistoria dos bens e objetos inventariados. Após o encerramento do presente contrato, a CONTRATADA terá o prazo de 07 (sete) dias corridos para reivindicar ou reclamar eventuais incongruências em relação a bens e objetos."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA SÉTIMA – DAS RESPONSABILIDADES E DECLARAÇÕES DO IDOSO E FAMILIARES</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "7.1. O IDOSO e seus familiares/responsáveis declaram que o IDOSO não é portador de doença infectocontagiosa."}, {"t": "p", "a": "justify", "h": "7.2. O IDOSO e seus familiares/responsáveis declaram que o IDOSO esteve submetido a Laudo Médico e/ou Psiquiátrico de Avaliação, o qual é neste ato apresentado, passando a fazer parte integrante deste contrato, assumindo o IDOSO e seus representantes familiares a responsabilidade pela veracidade das informações ali constantes."}, {"t": "p", "a": "justify", "h": "7.2.1. O IDOSO e seus familiares/responsáveis devem declarar toda e qualquer alteração comportamental, seja de ordem física ou mental, independentemente de já estar previamente validada por laudo médico, sendo que qualquer omissão de informações a respeito poderá acarretar medidas sancionatórias."}, {"t": "p", "a": "justify", "h": "7.3. O FAMILIAR/RESPONSÁVEL LEGAL declara que o IDOSO, durante a vigência deste contrato, continuará sob sua inteira responsabilidade, na qualidade de familiar, cabendo ao RESPONSÁVEL prestar toda a assistência inerente ao vínculo parental, seja econômica ou moral."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA OITAVA – MONITORAMENTO E PRIVACIDADE</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "8.1 - Monitoramento Institucional: A CONTRATANTE declara estar ciente e de acordo com o sistema de monitoramento por câmeras de vídeo e/ou áudio instalado nas dependências internas e externas da instituição, operado exclusivamente pela empresa, com a finalidade de garantir a segurança, o bem-estar e a transparência dos cuidados prestados aos residentes. As imagens e áudios captados poderão ser utilizados exclusivamente pela instituição para fins internos, administrativos, de segurança ou legais, em conformidade com a legislação vigente, especialmente a Lei Geral de Proteção de Dados (LGPD)."}, {"t": "p", "a": "justify", "h": "8.2 - Autorização para Uso de Imagem e Som: Os residentes e seus representantes legais, ao firmarem o presente contrato, autorizam expressamente o uso de suas imagens e sons captados pelas câmeras institucionais da CONTRATADA, exclusivamente para fins internos, administrativos, de segurança ou legais. É vedada a reprodução, o compartilhamento ou a utilização externa desse material sem autorização formal e prévia da instituição, ressalvadas as hipóteses de requisição por autoridade judicial, policial ou administrativa competente, nos termos da legislação vigente."}, {"t": "p", "a": "justify", "h": "8.3 - Proibição de Instalação de Equipamentos Particulares: É expressamente proibida a instalação, utilização ou manutenção de câmeras, microfones, gravadores ou quaisquer dispositivos de captação de imagem ou som de propriedade particular dentro das dependências da instituição, inclusive nos quartos dos residentes, ainda que com o consentimento do residente ou de seus familiares."}, {"t": "p", "a": "justify", "h": "8.4 - Justificativa da Restrição: Tal proibição visa proteger a privacidade, intimidade e dignidade dos demais residentes e da equipe técnica, uma vez que o ambiente é compartilhado, com circulação de pessoas e prestação de cuidados íntimos e sensíveis. O uso de dispositivos particulares por terceiros poderá acarretar violação à privacidade de terceiros, uso indevido de imagem e som, além de responsabilidade civil e trabalhista para a instituição."}, {"t": "p", "a": "justify", "h": "8.5 - Penalidades: O descumprimento desta cláusula poderá ensejar medidas administrativas, legais e, se necessário, a rescisão contratual por justa causa, sem prejuízo das indenizações cabíveis pelos danos eventualmente causados."}, {"t": "p", "a": "justify", "h": "8.6. A CONTRATANTE deverá ressarcir à CONTRATADA, no próximo dia 01 (um) de cada mês, ou seja, juntamente com a antecipação da mensalidade, todos os gastos extras que, excepcionalmente, a CONTRATADA venha a antecipar, tais como: materiais de higiene, medicamentos, fraldas, manicure, cabeleireiro e assemelhados, bem como eventuais reparos, substituições ou reposições decorrentes de avarias causadas por uso inadequado ou mau uso de bens da unidade pela CONTRATANTE, devidamente comprovados por nota fiscal ou relatório técnico. Tais valores deverão estar acompanhados da devida discriminação e comprovação, e serão incluídos em demonstrativo específico."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CLÁUSULA NONA – DISPOSIÇÕES GERAIS</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "9.1. As partes, de comum acordo, desde já elegem o Foro desta Cidade e Comarca de Curitiba/PR, com exclusão de qualquer outro, por mais privilegiado que seja. E por estarem justos e acertados, assinam o presente Contrato em duas vias de igual teor e forma, na presença das testemunhas abaixo."}, {"t": "p", "a": "right", "h": "Curitiba (PR), [data]."}, {"t": "tab", "b": false, "w": [50.0, 50.0], "r": [[{"h": "______________________________________<br><span style=\"color:#132434\"><b>CONTRATANTE (idoso)</b></span><br><span style=\"color:#132434\">[nome do idoso]</span>", "span": 1, "a": "center"}, {"h": "______________________________________<br><span style=\"color:#132434\"><b>ANUENTE / RESPONSÁVEL</b></span><br><span style=\"color:#132434\">[nome do responsável]</span>", "span": 1, "a": "center"}]]}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>SOLARY VILLE SANTA FELICIDADE</b></span>"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>CONTRATADA</b></span>"}, {"t": "p", "a": "left", "h": "<b>TESTEMUNHAS:</b>", "k": 1}, {"t": "tab", "b": false, "w": [50.0, 50.0], "r": [[{"h": "______________________________________<br><span style=\"color:#132434\"><b>Nome:</b></span><br><span style=\"color:#132434\">CPF:</span>", "span": 1, "a": "center"}, {"h": "______________________________________<br><span style=\"color:#132434\"><b>Nome:</b></span><br><span style=\"color:#132434\">CPF:</span>", "span": 1, "a": "center"}]]}], "prereserva": [{"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><span style=\"font-size:14.0pt\"><b>CONTRATO PRELIMINAR DE PRÉ-RESERVA</b></span></span>"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\">Reserva de vaga · Instituição de Longa Permanência para Idosos</span>"}, {"t": "p", "a": "justify", "h": "<b>CONTRATANTE:</b> Sr(a). [nome do idoso], [nacionalidade], nascido(a) em [data de nascimento], portador(a) do CPF [cpf] e RG [rg], residente no endereço [endereço], juntamente com seu(sua) responsável ANUENTE Sr(a). [nome do responsável], [nacionalidade do responsável], nascido(a) em [data de nascimento do responsável], portador(a) do CPF [cpf do responsável] e RG [rg do responsável], residente no endereço [endereço do responsável], doravante denominada CONTRATANTE."}, {"t": "p", "a": "justify", "h": "<b>CONTRATADA:</b> VS FATTORE INSTITUIÇÃO DE LONGA PERMANÊNCIA LTDA (SOLARY VILLE SANTA FELICIDADE - Instituição de Longa Permanência para Idosos), pessoa jurídica de direito privado, devidamente inscrita no CNPJ nº 57.764.744/0001-08, com sede na Rua Fredolin Wolf, nº 3290/3700, bairro Santa Felicidade, CEP 82410-326, em Curitiba/PR, neste ato representada por sua sócia administradora Susiane Pinkowski Santos, CPF nº 709.556.469-87, RG 3737471-7 SESP/PR, doravante denominada CONTRATADA."}, {"t": "p", "a": "justify", "h": "Pelo presente instrumento particular, as partes acima qualificadas, na melhor forma de direito, ajustam e contratam a prestação de serviços profissionais destinados a moradia definitiva, temporária e/ou provisória de idosos nos termos da Lei 10.741/2003 (Estatuto do Idoso), segundo as cláusulas e condições adiante descritas:"}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>CONSIDERANDO:</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "Que a SOLARY VILLE SANTA FELICIDADE é uma Instituição de Longa Permanência de Idosos (ILPI) destinada a oferecer moradia definitiva, temporária ou provisória para idosos, nos termos da Lei nº 10.741/2003 (Estatuto do Idoso), em condição de liberdade, dignidade e cidadania;"}, {"t": "p", "a": "justify", "h": "Que a CONTRATANTE tem interesse em realizar uma pré-reserva para contratação dos serviços da SOLARY VILLE SANTA FELICIDADE;"}, {"t": "p", "a": "justify", "h": "Resolvem as partes firmar o presente contrato preliminar, que se regerá pelas seguintes cláusulas e condições:"}, {"t": "p", "a": "justify", "h": "<b>1.</b> O objeto do presente instrumento é assegurar à CONTRATANTE uma vaga na Instituição de Longa Permanência de Idosos (ILPI) localizada na Rua Fredolin Wolf, nº 3290/3700, bairro Santa Felicidade, CEP 82410-326, Curitiba/PR."}, {"t": "p", "a": "justify", "h": "<b>2.</b> A pré-reserva refere-se à seguinte acomodação: [tipo de acomodação]."}, {"t": "p", "a": "justify", "h": "<b>3.</b> A pré-reserva objeto do presente instrumento está condicionada ao pagamento de uma caução no valor de R$ [valor da caução] ([valor da caução por extenso]), referente a 30% do valor da acomodação escolhida, a ser paga via transferência bancária para o Banco Itaú, agência 7013, conta 03143-5, em nome de VS FATTORE INSTITUIÇÃO DE LONGA PERMANÊNCIA LTDA, CNPJ 57.764.744/0001-08, ou via Pix pela chave celular (41) 98821-4720. O valor não é reembolsável em qualquer caso de não celebração do contrato definitivo por fatores alheios à vontade da SOLARY VILLE SANTA FELICIDADE, tais como, notadamente, a desistência pela CONTRATANTE ou quaisquer outras impossibilidades."}, {"t": "p", "a": "justify", "h": "<b>4.</b> O início da prestação dos serviços será até o dia [data prevista de entrada]. Caso não seja iniciado em 10 (dez) dias e seja desejável manter a reserva da acomodação, será celebrado o contrato definitivo e cobrado o valor integral da acomodação."}, {"t": "p", "a": "justify", "h": "<b>5.</b> A caução será abatida da primeira mensalidade a ser paga pela CONTRATANTE após a celebração do contrato definitivo."}, {"t": "p", "a": "justify", "h": "<b>6.</b> A CONTRATANTE declara que compreendeu os termos do presente instrumento, tendo tido oportunidade de lê-lo e questioná-lo, aceitando-o integralmente, assim como teve acesso ao teor do contrato definitivo a ser futuramente assinado, anuindo com seus termos e condições."}, {"t": "p", "a": "justify", "h": "<b>7.</b> O presente contrato é irrevogável e irretratável, sendo que as obrigações ora assumidas pelas partes obrigam também seus sucessores a qualquer título."}, {"t": "p", "a": "justify", "h": "<b>8.</b> As partes elegem o Foro da Comarca de Curitiba/PR como competente para dirimir quaisquer disputas relativas ao presente instrumento."}, {"t": "p", "a": "right", "h": "Curitiba (PR), [data]."}, {"t": "tab", "b": false, "w": [50.0, 50.0], "r": [[{"h": "______________________________________<br><span style=\"color:#132434\"><b>CONTRATANTE</b></span><br><span style=\"color:#132434\">[nome do idoso]</span>", "span": 1, "a": "center"}, {"h": "______________________________________<br><span style=\"color:#132434\"><b>ANUENTE</b></span><br><span style=\"color:#132434\">[nome do responsável]</span>", "span": 1, "a": "center"}]]}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>SOLARY VILLE SANTA FELICIDADE</b></span>"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>CONTRATADA</b></span>"}, {"t": "p", "a": "left", "h": "<b>TESTEMUNHAS:</b>", "k": 1}, {"t": "tab", "b": false, "w": [50.0, 50.0], "r": [[{"h": "______________________________________<br><span style=\"color:#132434\"><b>Nome:</b></span><br><span style=\"color:#132434\">CPF:</span>", "span": 1, "a": "center"}, {"h": "______________________________________<br><span style=\"color:#132434\"><b>Nome:</b></span><br><span style=\"color:#132434\">CPF:</span>", "span": 1, "a": "center"}]]}], "aditivo": [{"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><span style=\"font-size:14.0pt\"><b>ADITIVO AO CONTRATO DE PRESTAÇÃO DE SERVIÇOS</b></span></span>"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\">Moradia · Instituição de Longa Permanência para Idosos</span>"}, {"t": "p", "a": "justify", "h": "<b>CONTRATANTE:</b> Sr(a). [nome do idoso], [nacionalidade], nascido(a) em [data de nascimento], portador(a) do CPF [cpf] e RG [rg], residente no endereço [endereço], juntamente com seus responsáveis ANUENTES Sr(a). [nome do responsável 1], [nacionalidade do responsável 1], nascido(a) em [data de nascimento do responsável 1], portador(a) do CPF [cpf do responsável 1] e RG [rg do responsável 1], residente no endereço [endereço do responsável 1] e Sr(a). [nome do responsável 2], [nacionalidade do responsável 2], nascido(a) em [data de nascimento do responsável 2], portador(a) do CPF [cpf do responsável 2] e RG [rg do responsável 2], residente no endereço [endereço do responsável 2], doravante denominada CONTRATANTE."}, {"t": "p", "a": "justify", "h": "<b>CONTRATADA:</b> VS FATTORE INSTITUIÇÃO DE LONGA PERMANÊNCIA LTDA (SOLARY VILLE SANTA FELICIDADE - Instituição de Longa Permanência para Idosos), pessoa jurídica de direito privado, devidamente inscrita no CNPJ nº 57.764.744/0001-08, com sede na Rua Fredolin Wolf, nº 3290/3700, bairro Santa Felicidade, CEP 82410-326, em Curitiba/PR, neste ato representada por sua sócia administradora Susiane Pinkowski Santos, CPF nº 709.556.469-87, RG 3737471-7 SESP/PR, doravante denominada CONTRATADA."}, {"t": "p", "a": "justify", "h": "Pelo presente instrumento particular, as partes acima qualificadas, na melhor forma de direito, resolvem aditar o Contrato de Prestação de Serviços firmado em [data do contrato original], que passa a vigorar acrescido das cláusulas abaixo, permanecendo inalteradas as demais cláusulas e condições não modificadas por este aditivo, nos termos da Lei 10.741/2003 (Estatuto do Idoso):"}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DO PREÇO, CONDIÇÕES DE PAGAMENTO E DEMAIS INERENTES — CLÁUSULA OITAVA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "8.10 - A CONTRATANTE deverá ressarcir à CONTRATADA, no próximo dia 01 (um) de cada mês, ou seja, juntamente com a antecipação da mensalidade, todos os gastos extras que, excepcionalmente, a CONTRATADA venha a antecipar, tais como: materiais de higiene, medicamentos, fraldas, manicure, cabeleireiro e assemelhados, bem como eventuais reparos, substituições ou reposições decorrentes de avarias causadas por uso inadequado ou mau uso de bens da unidade pela CONTRATANTE, devidamente comprovados por nota fiscal ou relatório técnico. Tais valores deverão estar acompanhados da devida discriminação e comprovação, e serão incluídos em demonstrativo específico."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>MONITORAMENTO E PRIVACIDADE — CLÁUSULA DÉCIMA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "10.1 - Monitoramento Institucional: A CONTRATANTE declara estar ciente e de acordo com o sistema de monitoramento por câmeras de vídeo e/ou áudio instalado nas dependências internas e externas da instituição, operado exclusivamente pela empresa, com a finalidade de garantir a segurança, o bem-estar e a transparência dos cuidados prestados aos residentes. As imagens e áudios captados poderão ser utilizados exclusivamente pela instituição para fins internos, administrativos, de segurança ou legais, em conformidade com a legislação vigente, especialmente a Lei Geral de Proteção de Dados (LGPD)."}, {"t": "p", "a": "justify", "h": "10.2 - Autorização para Uso de Imagem e Som: Os residentes e seus representantes legais, ao firmarem o presente contrato, autorizam expressamente o uso de suas imagens e sons captados pelas câmeras institucionais da CONTRATADA, exclusivamente para fins internos, administrativos, de segurança ou legais. É vedada a reprodução, o compartilhamento ou a utilização externa desse material sem autorização formal e prévia da instituição, ressalvadas as hipóteses de requisição por autoridade judicial, policial ou administrativa competente, nos termos da legislação vigente."}, {"t": "p", "a": "justify", "h": "10.3 - Proibição de Instalação de Equipamentos Particulares: É expressamente proibida a instalação, utilização ou manutenção de câmeras, microfones, gravadores ou quaisquer dispositivos de captação de imagem ou som de propriedade particular dentro das dependências da instituição, inclusive nos quartos dos residentes, ainda que com o consentimento do residente ou de seus familiares."}, {"t": "p", "a": "justify", "h": "10.4 - Justificativa da Restrição: Tal proibição visa proteger a privacidade, intimidade e dignidade dos demais residentes e da equipe técnica, uma vez que o ambiente é compartilhado, com circulação de pessoas e prestação de cuidados íntimos e sensíveis. O uso de dispositivos particulares por terceiros poderá acarretar violação à privacidade de terceiros, uso indevido de imagem e som, além de responsabilidade civil e trabalhista para a instituição."}, {"t": "p", "a": "justify", "h": "10.5 - Penalidades: O descumprimento desta cláusula poderá ensejar medidas administrativas, legais e, se necessário, a rescisão contratual por justa causa, sem prejuízo das indenizações cabíveis pelos danos eventualmente causados."}, {"t": "p", "a": "", "h": "<span style=\"color:#132434\"><b>DO FORO — CLÁUSULA DÉCIMA SEGUNDA</b></span>", "k": 1}, {"t": "p", "a": "justify", "h": "12.1. O presente instrumento é constituído pelas partes em conformidade com o art. 585, II, CPC, constituindo-se título executivo extrajudicial."}, {"t": "p", "a": "justify", "h": "12.2. Fica eleito o foro da Comarca de Curitiba – PR para dirimir quaisquer questões oriundas deste contrato, renunciando as partes a qualquer outro, por mais privilegiado que seja."}, {"t": "p", "a": "justify", "h": "E assim, por estarem justas e contratadas, firmam o presente instrumento, em duas vias de igual teor e forma, na presença de 02 (duas) testemunhas abaixo qualificadas, obrigando-se ao seu fiel cumprimento, por si e seus sucessores."}, {"t": "p", "a": "right", "h": "Curitiba (PR), [data]."}, {"t": "tab", "b": false, "w": [50.0, 50.0], "r": [[{"h": "______________________________________<br><span style=\"color:#132434\"><b>CONTRATANTE (idoso)</b></span><br><span style=\"color:#132434\">[nome do idoso]</span>", "span": 1, "a": "center"}, {"h": "______________________________________<br><span style=\"color:#132434\"><b>SOLARY VILLE SANTA FELICIDADE</b></span><br><span style=\"color:#132434\">CONTRATADA</span>", "span": 1, "a": "center"}], [{"h": "______________________________________<br><span style=\"color:#132434\"><b>ANUENTE / RESPONSÁVEL</b></span><br><span style=\"color:#132434\">[nome do responsável 1]</span>", "span": 1, "a": "center"}, {"h": "______________________________________<br><span style=\"color:#132434\"><b>ANUENTE / RESPONSÁVEL</b></span><br><span style=\"color:#132434\">[nome do responsável 2]</span>", "span": 1, "a": "center"}]]}, {"t": "p", "a": "lef e autorização."}, {"t": "p", "a": "justify", "h": "O(a) residente autoriza a instituição a manter a utilização de todo material que contenha sua imagem mesmo após a sua saída da instituição, e renuncia a qualquer indenização a qualquer título."}, {"t": "p", "a": "", "h": "Curitiba, ____ de ____________________ de 20____."}, {"t": "p", "a": "center", "h": "__________________________________________________"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>Residente</b></span>"}, {"t": "p", "a": "center", "h": "__________________________________________________"}, {"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><b>Responsável / anuente</b></span>"}], "visitas": [{"t": "p", "a": "center", "h": "<span style=\"color:#132434\"><span style=\"font-size:14.0pt\"><b>AUTORIZAÇÃO DE VISITAS</b></span></span>"}, {"t": "tab", "b": true, "w": [32.35, 67.65], "r": [[{"h": "Nome do(a) residente:", "span": 1}, {"h": "", "span": 1}]]}, {"t": "sp"}, {"t": "p", "a": "justify", "h": "A instituição entrará em contato com a família imediatamente caso alguma visita não conste na listagem abaixo."}, {"t": "tab", "b": true, "w": [64.71, 35.29], "r": [[{"h": "<span style=\"color:#FFFFFF\"><b>Nome</b></span>", "span": 1, "bg": "132434"}, {"h": "<span style=\"color:#FFFFFF\"><b>Parentesco</b></span>", "span": 1, "bg": "132434"}], [{"h": "", "span": 1}, {"h": "", "span": 1}], [{"h": "", "span": 1}, {"h": "", "span": 1}], [{"h": "", "span": 1}, {"h": "", "span": 1}], [{"h": "", "span": 1}, {"h": "", "span": 1}], [{"h": "", "span": 1}, {"h": "", "span": 1}], [{"h": "", "span": 1}, {"h": "", "span": 1}], [{"h": "", "span": 1}, {"h": "", "span": 1}], [{"h": "", "span": 1}, {"h": "", "span": 1}], [{"h": "", "span": 1}, {"h": "", "span": 1}], [{"h": "", "span": 1}, {"h": "", "span": 1}]]}, {"t": "sp"}, {"t": "p", "a": "justify", "h": "Por ser verdade, assinamos abaixo."}, {"t": "p", "a": "", "h": "Curitiba, ____ de ____________________ de 20____."}, {"t": "p", "a": "cent DE SERVIÇOS AUTÔNOMOS (FREELANCER)</b></span>"}, {"t": "p", "a": "", "h": "<b>IDENTIFICAÇÃO DAS PARTES CONTRATANTES</b>", "k": 1}, {"t": "p", "a": "justify", "h": "<b>CONTRATANTE:</b> VS FATTORE INSTITUIÇÃO DE LONGA PERMANÊNCIA LTDA (SOLARY VILLE SANTA FELICIDADE - Instituição de Longa Permanência para Idosos), pessoa jurídica de direito privado, devidamente inscrita no CNPJ nº 57.764.744/0001-08, com sede na Rua Fredolin Wolf, nº 3290/3700, bairro Santa Felicidade, CEP 82410-326, em Curitiba/PR, neste ato representada por sua sócia administradora Susiane Pinkowski Santos, CPF nº 709.556.469-87, RG 3737471-7 SESP/PR, doravante denominada CONTRATANTE."}, {"t": "p", "a": "justify", "h": "<b>CONTRATADA:</b> [nome da contratada], [nacionalidade da contratada], portadora do CPF [cpf da contratada], residente na [endereço da contratada]."}, {"t": "p", "a": "justify", "h": "As partes acima identificadas têm, entre si, justo e acertado o presente Contrato de Prestação de Serviços Autônomos de [função], sem vínculo empregatício, nos termos dos artigos 593 a 609 do Código Civil e do artigo 442-B da Consolidação das Leis do Trabalho, que se regerá pelas cláusulas seguintes."}, {"t": "p", "a": "", "h": "<b>DO OBJETO</b>", "k": 1}, {"t": "p", "a": "justify", "h": "<b>Cláusula 1ª.</b> É objeto do presente contrato [objetivo da função], prestada de forma autônoma, em caráter temporário, para cobertura de plantões na unidade da CONTRATANTE."}, {"t": "p", "a": "", "h": "<b>DA NATUREZA DO CONTRATO</b>", "k": 1}, {"t": "p", "a": "justify", "h": "<b>Cláusula 2ª.</b> A CONTRATADA presta os serviços com autonomia, na condição de profissional autônoma (freelancer), não havendo entre as partes vínculo empregatício nem relação de subordinação. O presente contrato não constitui relação de emprego e não gera registro em Carteira de Trabalho e Previdência Social (CTPS)."}, {"t": "p", "a": "justify", "h": "<b>Cláusula 3ª.</b> A CONTRATADA declara ter sido devidamente informada e estar ciente de que, por se tratar de prestação de serviços autônoma, a presente contratação não se submete ao regime da CLT, não gerando os direitos e as verbas próprios da relação de emprego."}, {"t": "p", "a": "justify", "h": "<b>Cláusula 4ª.</b> A CONTRATADA declara que esta modalidade de contratação foi livremente acordada entre as partes, de forma consciente e sem qualquer coação, tendo recebido todas as explicações necessárias antes da assinatura deste instrumento."}, {"t": "p", "a": "justify", "h": "<b>Cláusula 5ª.</b> A CONTRATADA é responsável pelo recolhimento de suas contribuições previdenciárias na condição de contribuinte individual, ressalvadas as retenções que a legislação atribuir à CONTRATANTE."}, {"t": "p", "a": "", "h": "<b>DA PRESTAÇÃO DOS SERVIÇOS</b>", "k": 1}, {"t": "p", "a": "justify", "h": "<b>Cláusula 6ª.</b> Os serviços serão prestados no período de [início do período] a [fim do período], nos plantões previamente acordados entre as partes, na escala de [escala]."}, {"t": "p", "a": "justify", "h": "<b>Cláusula 7ª.</b> A CONTRATADA poderá aceitar ou recusar a realização de plantões adicionais aos acordados, sem qualquer penalidade."}, {"t": "p", "a": "justify", "h": "<b>Cláusula 8ª.</b> Não há exclusividade, podendo a CONTRATADA prestar serviços a outras pessoas ou instituições."}, {"t": "p", "a": "justify", "h": "<b>Cláusula 9ª.</b> Durante os plantões, a CONTRATADA observará os protocolos técnicos, de higiene e de segurança da instituição, necessários ao cuidado e à segurança dos residentes, o que não caracteriza subordinação jurídica."}, {"t": "p", "a": "", "h": "<b>DAS OBRIGAÇÕES DA CONTRATANTE</b>", "k": 1}, {"t": "p", "a": "justify", "h": "<b>Cláusula 10ª.</b> A CONTRATANTE fornecerá à CONTRATADA as informações, os materiais e os equipamentos de proteção necessários à execução dos serviços."}, {"t": "p", "a": "justify", "h": "<b>Cláusula 11ª.</b> A CONTRATANTE efetuará o pagamento na forma e nas condições estabelecidas na cláusula 12ª."}, {"t": "p", "a": "", "h": "<b>DO VALOR E DAS CONDIÇÕES DE PAGAMENTO</b>", "k": 1}, {"t": "p", "a": "justify", "h": "<b>Cláusula 12ª.</b> Pela prestação dos serviços, a CONTRATANTE pagará à CONTRATADA o valor de R$ [valor por 30 dias] pelo período de 30 (trinta) dias. Quando a prestação ocorrer em período inferior, o valor será proporcional aos dias de efetiva prestação dos serviços. O pagamento será realizado até o 5º (quinto) dia útil do mês seguinte, por transferência bancária ou Pix, mediante recibo de pagamento assinado pela CONTRATADA."}, {"t": "p", "a": "justify", "h": "<b>Cláusula 13ª.</b> Por mera liberalidade, a CONTRATANTE poderá conceder ajuda de custo para deslocamento e refeição no local durante os plantões, valores que não possuem natureza salarial e não se incorporam ao valor da prestação de serviços."}, {"t": "p", "a": "", "h": "<b>DO PRAZO</b>", "k": 1}, {"t": "p", "a": "justify", "h": "<b>Cláusula 14ª.</b> O presente contrato vigora pelo prazo de 30 (trinta) dias, a contar de [data de vigência], podendo ser prorrogado por igual período mediante acordo entre as partes."}, {"t": "p", "a": "", "h": "<b>DA RESCISÃO</b>", "k": 1}, {"t": "p", "a": "justify", "h": "<b>Cláusula 15ª.</b> O presente contrato poderá ser rescindido por qualquer das partes, a qualquer momento, sem necessidade de justificativa, desde que a outra parte seja comunicada por escrito com antecedência mínima de 48 (quarenta e oito) horas."}, {"t": "p", "a": "justify", "h": "<b>Cláusula 16ª.</b> Caso já tenha sido realizado ou previsto algum pagamento antecipado, inclusive valores referentes a ajuda de custo para deslocamento, será descontado do valor devido à CONTRATADA aquilo que não tiver sido efetivamente utilizado."}, {"t": "p", "a": "justify", "h": "<b>Cláusula 17ª.</b> Em caso de rescisão por iniciativa da CONTRATADA, deverão ser devolvidos os valores recebidos referentes aos serviços que não tenham sido prestados."}, {"t": "p", "a": "justify", "h": "<b>Cláusula 18ª.</b> Caso a CONTRATADA desista do contrato sem respeitar o prazo estabelecido, o pagamento devido permanecerá sendo realizado no quinto dia útil do mês subsequente, conforme as programações financeiras previamente estabelecidas pela CONTRATANTE."}, {"t": "p", "a": "", "h": "<b>DAS CONDIÇÕES GERAIS</b>", "k": 1}, {"t": "p", "a": "justify", "h": "<b>Cláusula 19ª.</b> Salvo com a expressa autorização da CONTRATANTE, a CONTRATADA não poderá transferir ou subcontratar os serviços previstos neste instrumento, sob pena de rescisão imediata."}, {"t": "p", "a": "justify", "h": "<b>Cláusula 20ª.</b> A CONTRATADA compromete-se a manter sigilo sobre as informações dos residentes e de seus familiares a que tiver acesso em razão dos serviços, nos termos da Lei Geral de Proteção de Dados (Lei nº 13.709/2018)."}, {"t": "p", "a": "", "h": "<b>DO FORO</b>", "k": 1}, {"t": "p", "a": "justify", "h": "<b>Cláusula 21ª.</b> As partes elegem o foro da comarca de Curitiba/PR para dirimir qualquer divergência oriunda deste instrumento. E, por estarem justas e contratadas, as partes assinam o presente instrumento em duas vias de igual teor e forma, na presença das testemunhas abaixo."}, {"t": "p", "a": "left", "h": "Curitiba, [data]."}, {"t": "p", "a": "justify", "h": "<i>Declaro que li e compreendi integralmente este contrato e que estou ciente de que se trata de prestação de serviços autônoma, sem registro em carteira de trabalho e sem os direitos próprios do trabalhador contratado pelo regime da CLT.</i>"}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<b>CONTRATANTE</b>"}, {"t": "p", "a": "center", "h": "<b>SOLARY VILLE SANTA FELICIDADE</b>"}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<b>CONTRATADA</b>"}, {"t": "p", "a": "center", "h": "<b>[nome da contratada]</b>"}, {"t": "p", "a": "", "h": "<b>TESTEMUNHAS:</b>", "k": 1}, {"t": "tab", "b": false, "w": [50, 50], "r": [[{"h": "<br>________________________________<br>Nome:<br>CPF:", "span": 1, "a": "center"}, {"h": "<br>________________________________<br>Nome:<br>CPF:", "span": 1, "a": "center"}]]}], "recibo": [{"t": "p", "a": "center", "h": "<span style=\"font-size:13pt\"><b>RECIBO DE PAGAMENTO DE PRESTAÇÃO DE SERVIÇOS AUTÔNOMOS</b></span>"}, {"t": "sp"}, {"t": "p", "a": "right", "h": "<b>Valor: R$ [valor pago]</b>"}, {"t": "p", "a": "justify", "h": "Eu, [nome da contratada], inscrita no CPF sob o nº [cpf da contratada], declaro que recebi de VS FATTORE INSTITUIÇÃO DE LONGA PERMANÊNCIA LTDA (Solary Ville Santa Felicidade), inscrita no CNPJ nº 57.764.744/0001-08, a importância de R$ [valor pago] ([valor pago por extenso]), por [forma de pagamento], referente à prestação de serviços autônomos de [função minúscula], no período de [início do período] a [fim do período], correspondente a [dias do período], conforme Contrato de Prestação de Serviços Autônomos firmado entre as partes, sem vínculo empregatício."}, {"t": "p", "a": "justify", "h": "Pelo valor recebido, dou plena, geral e irrevogável quitação referente ao período acima."}, {"t": "sp"}, {"t": "p", "a": "left", "h": "Curitiba, [data do pagamento]."}, {"t": "sp"}, {"t": "sp"}, {"t": "p", "a": "center", "h": "________________________________________________"}, {"t": "p", "a": "center", "h": "<b>CONTRATADA</b>"}, {"t": "p", "a": "center", "h": "<b>[nome da contratada]</b>"}, {"t": "p", "a": "center", "h": "CPF: [cpf da contratada]"}]};

// ---------- utilidades ----------
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dCurta(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function dExt(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); return `${d} de ${MESES[m-1]} de ${y}`; }
function numBR(t){ const s=String(t||'').replace(/[^\d,.]/g,''); if(!s) return NaN; return Number(s.indexOf(',')>=0? s.replace(/\./g,'').replace(',','.') : s); }
function fmtBR(v){ return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function extInt(n){
  const u=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  function a999(x){ if(!x) return ''; if(x===100) return 'cem'; const p=[]; const ce=Math.floor(x/100), r=x%100;
    if(ce) p.push(c[ce]); if(r){ if(r<20) p.push(u[r]); else { const de=Math.floor(r/10), un=r%10; p.push(un? dz[de]+' e '+u[un] : dz[de]); } } return p.join(' e '); }
  if(n===0) return 'zero';
  const mil=Math.floor(n/1000), resto=n%1000, p=[];
  if(mil) p.push(mil===1?'mil':a999(mil)+' mil');
  if(resto) p.push(a999(resto));
  return p.join((resto && (resto<100 || resto%100===0)) ? ' e ' : ' ');
}
function extenso(v){
  if(isNaN(v)) return '';
  const r=Math.floor(v+1e-9), c=Math.round((v-r)*100); let s='';
  if(r) s=extInt(r)+(r===1?' real':' reais');
  if(c) s+=(s?' e ':'')+extInt(c)+(c===1?' centavo':' centavos');
  return s||'zero reais';
}
function dias(a,b){ if(!a||!b) return null; const n=Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/86400000)+1; return n>0?n:null; }
function idade(iso){ if(!iso) return ''; const n=new Date(iso+'T00:00'), h=new Date(); let i=h.getFullYear()-n.getFullYear(); if(h<new Date(h.getFullYear(),n.getMonth(),n.getDate())) i--; return i; }

  [['',1],[' 1',1],[' 2',2]].forEach(([suf,n])=>{
    const p='r'+n+'_';

  M['[dias da semana]']=val('dias_sem'); M['[integral ou meio período]']=val('periodo');
  M['[check-in]']=dCurta(V.checkin); M['[check-out]']=dCurta(V.checkout);
  M['[data de entrada]']=dCurta(V.entrada); M['[data de saída]']=dCurta(V.saida);
  const nd=dias(V.entrada,V.saida); M['[quantidade de diárias]']= nd? (nd-1>0? (nd-1)+' ('+extInt(nd-1)+')' : '') : '';
  M['[valor do pacote]']=val('pacote'); M['[valor do pacote por extenso]']=extenso(numBR(V.pacote));

  M['[data do contrato original]']=dCurta(V.original); M['[data]']=dExt(V.data);
  // prestação

  M['[nome da contratada]']=val('p_nome'); M['[nacionalidade da contratada]']=val('p_nac'); M['[cpf da contratada]']=val('p_cpf'); M['[endereço da contratada]']=val('p_end');
  M['[função]']=fun; M['[função minúscula]']=fun.toLowerCase(); M['[objetivo da função]']=obj[fun]||'';
  M['[início do período]']=dCurta(V.p_ini); M['[fim do período]']=dCurta(V.p_fim);
  M['[escala]']= val('p_escala')==='outra'? val('p_escala_outra') : val('p_escala');
  M['[valor por 30 dias]']=val('p_valor'); M['[data de vigência]']=dCurta(V.p_vig);
  const pd=dias(V.p_ini,V.p_fim); let vp=numBR(V.rc_valor); const base=numBR(V.p_valor);
  if(isNaN(vp) && !isNaN(base) && pd) vp=Math.round(base/30*Math.min(pd,30)*100)/100;
  M['[valor pago]']= isNaN(vp)?'':fmtBR(vp); M['[valor pago por extenso]']= isNaN(vp)?'':extenso(vp);
  M['[forma de pagamento]']=val('rc_forma'); M['[dias do período]']= pd? pd+' ('+extInt(pd)+') dias':'';
  M['[data do pagamento]']=dExt(V.rc_data);

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function preencher(h,M){
  const semR2 = !val('r2_nome');
  if(semR2){
    h=h.replace(/,?\s*e Sr\(a\)\.\s*\[nome do responsável 2\][\s\S]*?\[endereço do responsável 2\]/g,'');
    h=h.replace('seus responsáveis ANUENTES','seu(sua) responsável ANUENTE');
  }
  ['[rg]','[rg do responsável]','[rg do responsável 1]','[rg do responsável 2]'].forEach(k=>{
    if(!M[k]) h=h.split(' e RG '+k).join('').split(', RG '+k).join('');
  });
  return h.replace(/\[[^\]<>]{2,60}\]/g, m=>{
    if(!(m in M)) return m;
    const v=M[m];
    return v ? esc(v) : `<span class="ph">${m}</span>`;
  });
}

// ---------- formulários (tabelas) ----------
const AUTO = {
  ficha:[['Nome:',0,'nome'],['Data de nascimento:',0,'nasc','d'],['Naturalidade:',0,'natural'],['Endereço atual:',0,'end'],['Nome:',1,'r1_nome'],['Endereço:',0,'r1_end'],['Celular:',1,'r1_tel'],['Nome:',2,'r2_nome'],['Endereço:',1,'r2_end'],['Celular:',2,'r2_tel']],
  cadastro:[['Nome completo:',0,'nome'],['Data de nascimento:',0,'nasc','d'],['Data de entrada:',0,'__entrada','m'],['RG:',0,'rg'],['CPF:',0,'cpf'],['Responsável 1:',0,'r1_nome'],['RG:',1,'r1_rg'],['Grau de parentesco:',0,'r1_par'],['Contato:',0,'r1_tel'],['Responsável 2:',0,'r2_nome'],['RG:',2,'r2_rg'],['Grau de parentesco:',1,'r2_par'],['Contato:',1,'r2_tel']],
  enfermagem:[['Nome completo',0,'nome'],['Data de nascimento / idade',0,'__nascidade','m'],['Responsável / contato',0,'__respcont','m']],
  imagem:[['Nome:',0,'nome'],['Endereço:',0,'end'],['RG:',0,'rg'],['Telefones:',0,'r1_tel'],['Representante legal (se houver):',0,'r1_nome']],
  visitas:[['Nome do(a) residente:',0,'nome']],
  pagamento:[['Nome do(a) residente:',0,'nome'],['Data de entrada:',0,'__entrada','m'],['Valor:',0,'__valorPag','m']]
};
function txt(h){ const d=document.createElement('div'); d.innerHTML=h; return d.textContent.trim(); }
function autoTabela(doc, blocos, M){
  const regras=AUTO[doc]; if(!regras) return blocos;
  const cont={};
  M.__nascidade = V.nasc ? dCurta(V.nasc)+'  ('+idade(V.nasc)+' anos)' : '';
  M.__respcont = [val('r1_nome'), val('r1_tel')].filter(Boolean).join(' · ');
  return blocos.map(b=>{
    if(b.t!=='tab') return b;
    const nb=JSON.parse(JSON.stringify(b));
    nb.r.forEach(row=>{
      for(let i=0;i<row.length-1;i++){
        const lab=txt(row[i].h);
        const n=cont[lab]||0;
        const regra=regras.find(r=>r[0]===lab && r[1]===n);
        if(regras.some(r=>r[0]===lab)) cont[lab]=n+1;
        if(!regra) continue;
        let v = regra[3]==='m' ? M[regra[2]] : (regra[3]==='d' ? dCurta(V[regra[2]]) : val(regra[2]));
        if(v){ row[i+1].h='<span class="val">'+esc(v)+'</span>'; }
      }
    });
    return nb;
  });
}

function novaPagina(){
  const pg=document.createElement('div'); pg.className='pagina';
  pg.innerHTML=`<img class="cab" src="${IMG_CAB}" alt=""><img class="rod" src="${IMG_ROD}" alt=""><div class="corpo"></div>`;

function blocoEl(b){
  if(b.t==='sp'){ const d=document.createElement('div'); d.className='esp'; return d; }
  if(b.t==='ass'){ const d=document.createElement('div'); d.className='ass'; d.innerHTML=b.h; return d; }
  if(b.t==='tab'){
    const t=document.createElement('table'); if(b.b) t.className='borda';
    const cg=document.createElement('colgroup'); b.w.forEach(w=>{ const c=document.createElement('col'); c.style.width=w+'%'; cg.appendChild(c); }); t.appendChild(cg);
    b.r.forEach(row=>{ const tr=document.createElement('tr'); row.forEach(c=>{ const td=document.createElement('td'); td.innerHTML=c.h||'&nbsp;'; if(c.span>1) td.colSpan=c.span; if(c.rs>1) td.rowSpan=c.rs; if(c.bg) td.style.background='#'+c.bg; if(c.a) td.style.textAlign=c.a; if(c.nb) td.style.border='none'; tr.appendChild(td); }); t.appendChild(tr); });
    return t;
  }
  const p=document.createElement('p'); p.innerHTML=b.h; if(b.a) p.style.textAlign=b.a; if(b.k) p.dataset.k='1'; return p;
}
function agrupar(blocos){
  // junta linha de assinatura + rótulos seguintes num bloco só
  const out=[];
  for(let i=0;i<blocos.length;i++){
    const b=blocos[i];
    if(b.t==='p' && /^_{10,}$/.test(txt(b.h)) && b.a==='center'){
      let h='<p>'+b.h+'</p>'; let j=i+1;
      while(j<blocos.length && blocos[j].t==='p' && blocos[j].a==='center' && !/^_{10,}$/.test(txt(blocos[j].h)) && j-i<=3){ h+='<p>'+blocos[j].h+'</p>'; j++; }
      out.push({t:'ass',h}); i=j-1;
    } else out.push(b);
  }
  return out;
}
function renderDoc(doc, M, nomeArquivo){
  let blocos=agrupar(DOCS[doc]);
  blocos=autoTabela(doc,blocos,M);
  if(!val('r2_nome')) blocos=blocos.filter(b=>!(b.t==='ass' && b.h.indexOf('[nome do responsável 2]')>=0)).map(b=>{
    if(b.t!=='tab') return b; const nb=JSON.parse(JSON.stringify(b));
    nb.r.forEach(r=>r.forEach(c=>{ if(c.h.indexOf('[nome do responsável 2]')>=0) c.h=''; })); return nb; });
  const wrap=document.createElement('div'); wrap.className='doc-wrap'; wrap.dataset.doc=doc;
  const barra=document.createElement('div'); barra.className='doc-barra';
  barra.innerHTML=`<strong>${NOMES_DOC[doc]}</strong><button>Imprimir / salvar PDF</button>`;
  barra.querySelector('button').onclick=()=>imprimir(wrap, nomeArquivo);
  wrap.appendChild(barra);
  document.getElementById('paginas').appendChild(wrap);
  let pg=novaPagina(); wrap.appendChild(pg); let corpo=pg.querySelector('.corpo');
  blocos.forEach(b=>{
    const html = b.t==='tab' ? null : null;
    let bb=b;
    if(b.t==='p'||b.t==='ass') bb=Object.assign({},b,{h:preencherForm(preencher(b.h,M),M)});
    if(b.t==='tab') bb=Object.assign({},b,{r:b.r.map(r=>r.map(c=>Object.assign({},c,{h:preencher(c.h,M)})))});
    const el=blocoEl(bb);
    corpo.appendChild(el);
    if(corpo.scrollHeight>corpo.clientHeight+1 && corpo.children.length>1){
      corpo.removeChild(el);
      const ult=corpo.lastElementChild; let mover=null;
      if(ult && ult.dataset && ult.dataset.k && corpo.children.length>1){ mover=ult; corpo.removeChild(ult); }
      while(corpo.lastElementChild && corpo.lastElementChild.className==='esp') corpo.removeChild(corpo.lastElementChild);
      pg=novaPagina(); wrap.appendChild(pg); corpo=pg.querySelector('.corpo');
      if(mover) corpo.appendChild(mover);
      if(bb.t!=='sp') corpo.appendChild(el);
    }
  });
}
function preencherForm(h,M){
  // "Curitiba, ____ de ______ de 20____." e "Data: ____/____/____"
  if(V.data){
    h=h.replace(/Curitiba,\s*_+\s*de\s*_+\s*de\s*20_+\./, 'Curitiba, '+esc(dExt(V.data))+'.');
    h=h.replace(/^Data:\s*_+\/_+\/_+$/, 'Data: '+esc(dCurta(V.data)));

  return h;
}
function nomeArq(doc){
  const P=pacote; const nome = val(P.nomeCampo||'nome') || (P.nomeCampo? 'Colaboradora':'Residente');

function gerar(){
  const area=document.getElementById('paginas'); area.innerHTML='';
  const marcados=[...document.querySelectorAll('.docs-lista input:checked')].map(i=>i.value);
  if(!marcados.length){ area.innerHTML='<div class="vazio">Selecione pelo menos um documento.</div>'; return; }
  const M=mapa();
  marcados.forEach(d=>renderDoc(d,M,nomeArq(d)));
}
const TITULO=document.title;
function imprimir(wrap, nome){

}

};

const q=new URLSearchParams(location.search).get('doc');
abrir(q && PACOTES.some(p=>p.id===q) ? q : 'permanente');
